# Despliegue en Render (render.com) con "New → Blueprint".
# Versión gratuita: el servidor usa el plan Free de Render y la base de datos
# está en Neon (neon.tech, PostgreSQL gratis). Ver DESPLIEGUE.md.
services:
  - type: web
    name: flight-center
    runtime: node
    rootDir: servidor
    plan: free
    region: virginia
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_TOKEN
        generateValue: true
      # Dirección de la base de datos de Neon (Connection string)
      - key: DATABASE_URL
        sync: false
      # Primer usuario administrador (se crea solo la primera vez)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Emails (Gmail de la escuela con contraseña de aplicación)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # WhatsApp Business (API oficial de Meta)
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      # NOTAM (clave gratuita de la FAA)
      - key: FAA_CLIENT_ID
        sync: false
      - key: FAA_CLIENT_SECRET
        sync: false
