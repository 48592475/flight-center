<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flight Center Reservas</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="theme-color" content="#0b2545">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flight Center">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* Paleta azul aviación: navy de cabina, azul institucional, celeste de cielo, blanco. Layout: barra superior + vistas por rol. */
:root {
  --navy: #0a2540;
  --navy-2: #0f3460;
  --azul: #1565c0;
  --azul-2: #1e88e5;
  --celeste: #4fc3f7;
  --celeste-2: #81d4fa;
  --celeste-claro: #e3f2fd;
  --blanco: #ffffff;
  --bg: #f2f7fc;
  --text: #0f2a44;
  --muted: #5b7690;
  --borde: #d6e4f2;
  --ok: #12a37a;
  --warn: #e8a317;
  --danger: #d64545;
  --radius: 16px;
  --sombra: 0 10px 30px -12px rgba(10, 37, 64, .25);
  --sombra-2: 0 24px 60px -20px rgba(10, 37, 64, .45);
  --ease: cubic-bezier(.22, 1, .36, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-size: 15px;
  font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--azul); }
h1, h2, h3 { margin: 0; letter-spacing: -.02em; }

/* ---------- animaciones base ---------- */
@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.03); opacity: 1; } 100% { transform: scale(1); } }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
@keyframes fly {
  0% { transform: translate(-15vw, 30vh) rotate(-8deg); }
  100% { transform: translate(115vw, -10vh) rotate(-8deg); }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { from { background-position: -400px 0; } to { background-position: 400px 0; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(79, 195, 247, .5); } 50% { box-shadow: 0 0 0 8px rgba(79, 195, 247, 0); } }

.anim { animation: fadeUp .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
}

/* ---------- login ---------- */
.login {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #0a2540 0%, #1565c0 45%, #4fc3f7 85%, #b3e5fc 100%);
}
.cloud {
  position: absolute;
  background: rgba(255, 255, 255, .85);
  border-radius: 100px;
  filter: blur(1px);
  animation: drift linear infinite;
  opacity: .7;
}
.cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
.cloud::before { width: 55%; height: 160%; top: -70%; left: 12%; }
.cloud::after { width: 40%; height: 120%; top: -45%; left: 48%; }
.plane-fly {
  position: absolute; left: 0; top: 0;
  width: 70px; color: #fff;
  animation: fly 14s linear infinite;
  filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .25));
}
.login-card {
  position: relative; z-index: 2;
  width: min(420px, 100%);
  background: rgba(255, 255, 255, .94);
  backdrop-filter: blur(14px);
  border-radius: 24px;
  padding: 36px 32px 28px;
  box-shadow: var(--sombra-2);
  animation: pop .8s var(--ease) both;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  width: 46px; height: 46px; border-radius: 14px;
  background: linear-gradient(135deg, var(--azul), var(--celeste));
  display: grid; place-items: center; color: #fff;
  box-shadow: 0 8px 18px -6px rgba(21, 101, 192, .6);
}
.brand-logo svg { width: 26px; transform: rotate(45deg); }
.brand h1 { font-size: 22px; font-weight: 800; }
.brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
.login-card form { margin-top: 26px; display: grid; gap: 14px; }
.demo { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--borde); font-size: 12.5px; color: var(--muted); }
.demo-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.demo-list button {
  border: 1px solid var(--borde); background: var(--celeste-claro); color: var(--azul);
  border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  transition: transform .2s var(--ease), background .2s;
}
.demo-list button:hover { transform: translateY(-2px); background: #cfe8fb; }

/* ---------- formularios ---------- */
label.campo { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--navy-2); }
label.campo span.op { font-weight: 500; color: var(--muted); }
input, select, textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--borde);
  border-radius: 12px;
  background: #fff;
  transition: border-color .2s, box-shadow .2s;
}
textarea { resize: vertical; min-height: 80px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--azul-2); box-shadow: 0 0 0 4px rgba(30, 136, 229, .15); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 12px; padding: 11px 18px;
  font-weight: 700; font-size: 14px; cursor: pointer;
  background: linear-gradient(135deg, var(--azul), var(--azul-2));
  color: #fff;
  box-shadow: 0 8px 18px -8px rgba(21, 101, 192, .7);
  transition: transform .2s var(--ease), box-shadow .2s, opacity .2s;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -10px rgba(21, 101, 192, .8); }
.btn:active { transform: translateY(0) scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.sec { background: #fff; color: var(--azul); border: 1.5px solid var(--borde); box-shadow: none; }
.btn.sec:hover { border-color: var(--celeste); background: var(--celeste-claro); }
.btn.danger { background: #fff; color: var(--danger); border: 1.5px solid #f3caca; box-shadow: none; }
.btn.danger:hover { background: #fdeeee; }
.btn.ok { background: linear-gradient(135deg, #0f8f6a, var(--ok)); box-shadow: 0 8px 18px -8px rgba(18, 163, 122, .7); }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; padding: 13px; }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, .4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
.error-msg { color: var(--danger); font-size: 13px; font-weight: 600; min-height: 18px; }

/* ---------- layout app ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px);
  background: linear-gradient(90deg, var(--navy), var(--navy-2) 60%, var(--azul));
  color: #fff;
  box-shadow: 0 6px 20px -10px rgba(10, 37, 64, .6);
}
.topbar-inner { max-width: 1180px; margin: 0 auto; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 18px; }
.topbar .brand h1 { font-size: 18px; color: #fff; }
.topbar .brand small { color: var(--celeste-2); font-size: 10.5px; }
.topbar .brand-logo { width: 38px; height: 38px; border-radius: 11px; }
.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative;
  background: transparent; border: 0; color: rgba(255, 255, 255, .75);
  padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
  transition: color .2s, background .2s; white-space: nowrap;
}
.tab:hover { color: #fff; background: rgba(255, 255, 255, .08); }
.tab.activo { color: #fff; background: rgba(79, 195, 247, .18); }
.tab.activo::after {
  content: ''; position: absolute; left: 14px; right: 14px; bottom: 3px; height: 2px; border-radius: 2px;
  background: var(--celeste); animation: fadeIn .3s;
}
.user-chip { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--celeste), var(--azul-2));
  display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff;
  border: 2px solid rgba(255, 255, 255, .6); flex: none;
}
.logout { background: rgba(255, 255, 255, .1); border: 0; color: #fff; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; transition: background .2s; flex: none; }
.logout:hover { background: rgba(255, 255, 255, .2); }

main { max-width: 1180px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); }
.demo-tag { display:inline-block; margin-top:10px; font-size:12px; font-weight:700; color:var(--azul); background:var(--celeste-claro); padding:3px 10px; border-radius:999px; }
.link-btn { background:none; border:0; color:var(--azul); font-weight:600; font-size:12.5px; cursor:pointer; padding:0; text-decoration:underline; }
.pdf-view { background:#eef4fa; border-radius:12px; padding:12px; display:grid; gap:12px; justify-items:center; max-height:65vh; overflow:auto; }
.pdf-view canvas { max-width:100%; height:auto; box-shadow: var(--sombra); background:#fff; }
:focus-visible { outline: 3px solid var(--celeste); outline-offset: 2px; }
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(120deg, var(--azul) 0%, var(--azul-2) 50%, var(--celeste) 100%);
  border-radius: 22px; padding: 26px 28px; color: #fff; margin-bottom: 26px;
  box-shadow: var(--sombra);
}
.hero h2 { font-size: 26px; font-weight: 800; }
.hero p { margin: 6px 0 0; opacity: .9; max-width: 620px; }
.hero .deco { position: absolute; right: -10px; bottom: -30px; width: 220px; opacity: .15; transform: rotate(-20deg); }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em;
  background: var(--celeste-claro); color: var(--azul);
}
.hero .badge { background: rgba(255, 255, 255, .2); color: #fff; margin-bottom: 10px; }
.badge.ok { background: #dff6ee; color: #0b7a59; }
.badge.warn { background: #fdf2d8; color: #9a6a00; }
.badge.danger { background: #fde3e3; color: #b23030; }
.badge.gris { background: #edf1f5; color: #5b6b7a; }

.card {
  background: #fff; border: 1px solid var(--borde); border-radius: var(--radius);
  padding: 22px; box-shadow: var(--sombra);
}
.card + .card { margin-top: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.card-head h3 { font-size: 17px; }
.paso { display: flex; align-items: center; gap: 10px; }
.paso-num {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  background: var(--celeste-claro); color: var(--azul); font-weight: 800; font-size: 13px;
  display: grid; place-items: center; transition: background .3s, color .3s;
}
.paso.hecho .paso-num { background: var(--azul-2); color: #fff; }
.muted { color: var(--muted); font-size: 13.5px; }

/* ---------- selector de días ---------- */
.dias { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x mandatory; }
.dia {
  flex: none; width: 74px; scroll-snap-align: start;
  border: 1.5px solid var(--borde); background: #fff; border-radius: 14px;
  padding: 10px 6px; text-align: center; cursor: pointer;
  transition: transform .25s var(--ease), border-color .2s, background .2s, box-shadow .25s;
}
.dia:hover { transform: translateY(-3px); border-color: var(--celeste); }
.dia small { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
.dia strong { display: block; font-size: 24px; font-weight: 800; margin: 2px 0; }
.dia.sel { background: linear-gradient(160deg, var(--azul), var(--azul-2)); border-color: transparent; color: #fff; box-shadow: 0 12px 22px -10px rgba(21, 101, 192, .8); transform: translateY(-3px); }
.dia.sel small { color: var(--celeste-2); }

/* ---------- bloques ---------- */
.bloques { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.bloque {
  position: relative; text-align: left;
  border: 1.5px solid var(--borde); background: #fff; border-radius: 14px; padding: 14px 16px;
  cursor: pointer; transition: transform .25s var(--ease), border-color .2s, background .2s, box-shadow .25s;
}
.bloque:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--celeste); box-shadow: var(--sombra); }

.bloque .hora { white-space: nowrap; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 17px; font-weight: 700; }
.bloque .estado { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 600; }
.bloque .check {
  position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--borde); display: grid; place-items: center; transition: all .25s var(--ease);
}
.bloque.sel { border-color: var(--azul-2); background: var(--celeste-claro); }
.bloque.sel .check { background: var(--azul-2); border-color: var(--azul-2); color: #fff; transform: scale(1.1); }
.bloque:disabled { cursor: not-allowed; opacity: .55; background: #f7f9fb; }
.bloque.mio { opacity: 1; border-style: dashed; border-color: var(--celeste); background: #f3fbff; }

/* ---------- tarjetas de selección (instructor / avión) ---------- */
.opciones { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.opcion {
  display: flex; align-items: center; gap: 12px; text-align: left;
  border: 1.5px solid var(--borde); background: #fff; border-radius: 14px; padding: 12px 14px; cursor: pointer;
  transition: transform .25s var(--ease), border-color .2s, background .2s, box-shadow .25s;
}
.opcion:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--celeste); box-shadow: var(--sombra); }
.opcion.sel { border-color: var(--azul-2); background: var(--celeste-claro); animation: pulse 1.6s 1; }
.opcion:disabled { opacity: .45; cursor: not-allowed; }
.opcion .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--celeste-claro); color: var(--azul); font-weight: 800; }
.opcion.sel .ico { background: var(--azul-2); color: #fff; }
.opcion strong { display: block; font-size: 14.5px; }
.opcion small { color: var(--muted); font-size: 12px; }

.resumen-reserva {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  margin-top: 20px; padding: 16px 18px; border-radius: 14px;
  background: linear-gradient(90deg, var(--celeste-claro), #fff);
  border: 1px solid var(--borde);
}
.collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease), opacity .4s; opacity: 0; }
.collapse > div { overflow: hidden; }
.collapse.open { grid-template-rows: 1fr; opacity: 1; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat {
  background: #fff; border: 1px solid var(--borde); border-radius: var(--radius); padding: 18px;
  box-shadow: var(--sombra); position: relative; overflow: hidden;
}
.stat::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: linear-gradient(var(--azul-2), var(--celeste)); }
.stat .lbl { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat .val { font-size: 32px; font-weight: 800; margin-top: 6px; color: var(--navy); font-variant-numeric: tabular-nums; }
.stat .val small { font-size: 14px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.stat.dest { background: linear-gradient(135deg, var(--navy), var(--azul)); color: #fff; border: 0; }
.stat.dest .lbl { color: var(--celeste-2); }
.stat.dest .val { color: #fff; }
.stat.dest .val small { color: var(--celeste-2); }

/* gráfico de barras */
.chart { display: flex; align-items: flex-end; gap: 14px; height: 200px; padding: 10px 4px 0; border-bottom: 1.5px solid var(--borde); }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; min-width: 0; }
.bar {
  width: 100%; max-width: 54px; border-radius: 10px 10px 4px 4px;
  background: linear-gradient(180deg, var(--celeste), var(--azul-2));
  transform-origin: bottom; transform: scaleY(0);
  transition: transform 1s var(--ease);
  transition-delay: calc(var(--i, 0) * 90ms);
  min-height: 3px;
}
.bar.on { transform: scaleY(1); }
.bar-val { font-size: 12px; font-weight: 700; color: var(--navy-2); }
.bar-lbls { display: flex; gap: 14px; padding: 8px 4px 0; }
.bar-lbls span { flex: 1; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: capitalize; }
.hbar { display: grid; grid-template-columns: 70px 1fr 50px; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 13px; font-weight: 600; }
.hbar .track { height: 10px; background: var(--celeste-claro); border-radius: 10px; overflow: hidden; }
.hbar .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--azul-2), var(--celeste)); border-radius: 10px; transition: width 1.1s var(--ease); }
.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.grid-2 > .card + .card { margin-top: 0; }
.grid-2 + .card { margin-top: 20px; }
.cap { display: inline-block; }
.cap::first-letter { text-transform: uppercase; }

/* ---------- tablas / listas ---------- */
.tabla-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 12px; border-bottom: 1.5px solid var(--borde); white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid #edf3f9; vertical-align: top; }
tbody tr { transition: background .2s; }
tbody tr:hover { background: #f7fbff; }
.mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-weight: 600; }

.vuelo {
  display: grid; grid-template-columns: 86px 1fr auto; gap: 16px; align-items: center;
  padding: 14px 16px; border: 1px solid var(--borde); border-radius: 14px; background: #fff;
  transition: transform .25s var(--ease), box-shadow .25s, border-color .2s;
}
.vuelo + .vuelo { margin-top: 10px; }
.vuelo:hover { transform: translateX(4px); box-shadow: var(--sombra); border-color: var(--celeste); }
.vuelo-fecha { text-align: center; background: var(--celeste-claro); border-radius: 12px; padding: 8px 4px; }
.vuelo-fecha small { display: block; font-size: 11px; font-weight: 700; color: var(--azul); text-transform: uppercase; }
.vuelo-fecha strong { display: block; font-size: 22px; font-weight: 800; color: var(--navy); line-height: 1.1; }
.vuelo-info strong { font-size: 15px; }
.vuelo-info .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.vuelo-acc { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.contacto { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.contacto a { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; text-decoration: none; background: var(--celeste-claro); color: var(--azul); padding: 4px 10px; border-radius: 999px; transition: background .2s; }
.contacto a:hover { background: #cfe8fb; }
.vacio { text-align: center; padding: 36px 16px; color: var(--muted); }
.vacio svg { width: 54px; color: var(--celeste); margin-bottom: 8px; }

/* ---------- aeronaves ---------- */
.aviones { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.avion {
  background: #fff; border: 1.5px solid var(--borde); border-radius: var(--radius); padding: 18px; cursor: pointer; text-align: left;
  transition: transform .3s var(--ease), box-shadow .3s, border-color .2s; position: relative; overflow: hidden;
}
.avion:hover { transform: translateY(-4px); box-shadow: var(--sombra-2); border-color: var(--celeste); }
.avion.sel { border-color: var(--azul-2); box-shadow: 0 0 0 4px rgba(30, 136, 229, .15); }
.avion .silueta { position: absolute; right: -14px; top: -8px; width: 110px; color: var(--celeste-claro); transform: rotate(35deg); transition: transform .5s var(--ease); }
.avion:hover .silueta { transform: rotate(35deg) translate(8px, -6px); }
.avion .mat { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 22px; font-weight: 700; color: var(--navy); position: relative; }
.avion .mod { color: var(--muted); font-size: 13.5px; position: relative; }
.avion .pie { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; position: relative; }

.novedad { border: 1px solid var(--borde); border-left: 4px solid var(--azul-2); border-radius: 12px; padding: 14px 16px; background: #fff; }
.novedad + .novedad { margin-top: 10px; }
.novedad.falla { border-left-color: var(--danger); }
.novedad.mantenimiento { border-left-color: var(--warn); }
.novedad.resuelta { opacity: .7; background: #fafcfe; }
.novedad-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.novedad p { margin: 8px 0 0; font-size: 14px; }
.novedad .res { font-size: 13px; color: #0b7a59; background: #eefaf5; padding: 8px 10px; border-radius: 8px; margin-top: 8px; }
.novedad .acc { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

/* ---------- perfil ---------- */
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 18px; }
.form-grid .full { grid-column: 1 / -1; }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.doc {
  border: 1.5px dashed var(--borde); border-radius: 14px; padding: 16px; background: #fbfdff;
  transition: border-color .2s, background .2s, transform .25s var(--ease);
}
.doc.cargado { border-style: solid; border-color: #bfe6d6; background: #f5fcf9; }
.doc.drag { border-color: var(--azul-2); background: var(--celeste-claro); transform: scale(1.02); }
.doc-ico { width: 40px; height: 40px; border-radius: 10px; background: var(--celeste-claro); color: var(--azul); display: grid; place-items: center; font-weight: 800; font-size: 11px; margin-bottom: 10px; }
.doc.cargado .doc-ico { background: #dff6ee; color: #0b7a59; }
.doc strong { display: block; font-size: 14.5px; }
.doc .acc { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

/* ---------- modal ---------- */
.modal-bg {
  position: fixed; inset: 0; z-index: 50; background: rgba(10, 37, 64, .55); backdrop-filter: blur(4px);
  display: grid; place-items: center; padding: 16px; animation: fadeIn .25s both; overflow-y: auto;
}
.modal {
  background: #fff; border-radius: 20px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto;
  box-shadow: var(--sombra-2); animation: pop .45s var(--ease) both;
}
.modal.ancho { width: min(820px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--borde); position: sticky; top: 0; background: #fff; z-index: 1; }
.modal-body { padding: 22px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 0 22px 22px; flex-wrap: wrap; }
.x { background: var(--celeste-claro); border: 0; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 18px; color: var(--azul); transition: transform .2s; }
.x:hover { transform: rotate(90deg); }
.ficha { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 18px; }
.ficha div small { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.ficha div span { font-weight: 600; font-size: 14.5px; word-break: break-word; }

/* ---------- toasts ---------- */
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 100; display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); }
.toast {
  background: var(--navy); color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;
  box-shadow: var(--sombra-2); animation: fadeUp .4s var(--ease) both; display: flex; gap: 10px; align-items: center;
}
.toast.error { background: #a62f2f; }
.toast.ok { background: #0b7a59; }
.toast.out { animation: fadeIn .3s reverse both; }

/* ---------- BOARDING PASS ---------- */
.bp-escena { position: fixed; inset: 0; z-index: 60; display: flex; padding: 16px; background: radial-gradient(circle at 50% 30%, rgba(21, 101, 192, .75), rgba(10, 37, 64, .92)); animation: fadeIn .3s both; overflow-y: auto; }
.bp-wrap { width: min(820px, 100%); position: relative; margin: auto; }
.bp-titulo { text-align: center; color: #fff; margin-bottom: 18px; animation: fadeUp .6s .1s var(--ease) both; }
.bp-titulo h2 { font-size: 24px; }
.bp-titulo p { margin: 4px 0 0; color: var(--celeste-2); }
.bp-ranura { height: 12px; border-radius: 12px; background: #06182c; box-shadow: inset 0 3px 6px rgba(0, 0, 0, .6); margin: 0 18px; position: relative; z-index: 2; }
.bp-clip { overflow: hidden; margin-top: -6px; padding: 0 6px 30px; }
@keyframes imprimir { 0% { transform: translateY(-104%); } 70% { transform: translateY(2%); } 100% { transform: translateY(0); } }
.bp {
  display: grid; grid-template-columns: 1fr 230px;
  background: #fff; border-radius: 18px; overflow: hidden; color: var(--text);
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .6);
  animation: imprimir 1.6s .35s var(--ease) both;
  position: relative;
}
.bp-main { position: relative; }
.bp-head {
  background: linear-gradient(110deg, var(--navy) 0%, var(--azul) 55%, var(--celeste) 100%);
  color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.bp-head .brand h1 { font-size: 17px; color: #fff; }
.bp-head .brand small { color: var(--celeste-2); }
.bp-head .brand-logo { width: 34px; height: 34px; border-radius: 10px; background: rgba(255, 255, 255, .2); box-shadow: none; }
.bp-tipo { font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; opacity: .9; text-align: right; }
.bp-ruta { display: flex; align-items: center; gap: 14px; padding: 20px 24px 6px; }
.bp-ruta .cod { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 38px; font-weight: 700; color: var(--navy); line-height: 1; }
.bp-ruta .cod small { display: block; font-family: 'Barlow', system-ui, sans-serif; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; margin-top: 4px; }
.bp-linea { flex: 1; position: relative; height: 2px; background: repeating-linear-gradient(90deg, var(--celeste) 0 8px, transparent 8px 14px); }
.bp-linea svg { position: absolute; top: 50%; width: 26px; color: var(--azul-2); transform: translate(-50%, -50%) rotate(90deg); animation: cruzar 2.4s 1.6s var(--ease) both; }
@keyframes cruzar { from { left: 0; opacity: 0; } 15% { opacity: 1; } to { left: 50%; } }
.bp-campos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 18px; padding: 16px 24px 22px; }
.bp-main > .bp-campos { padding-bottom: 60px; }
.bp-campos div small { display: block; font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.bp-campos div span { display: block; font-weight: 700; font-size: 15px; margin-top: 2px; }
.bp-campos .grande span { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 20px; color: var(--azul); }
.bp-stub { position: relative; background: var(--celeste-claro); padding: 18px 20px; border-left: 2px dashed #9fc6e8; display: flex; flex-direction: column; gap: 10px; }
.bp-stub::before, .bp-stub::after { content: ''; position: absolute; left: -13px; width: 24px; height: 24px; border-radius: 50%; background: #0d2c52; }
.bp-stub::before { top: -12px; }
.bp-stub::after { bottom: -12px; }
.bp-stub .bp-campos { grid-template-columns: 1fr 1fr; padding: 0; gap: 10px; }
.bp-stub .bp-campos span { font-size: 13.5px; }
.barcode { display: flex; align-items: stretch; height: 56px; gap: 0; margin-top: auto; }
.barcode i { display: block; background: var(--navy); }
.bp-codigo { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .2em; text-align: center; color: var(--navy-2); }
.bp-acc { display: flex; justify-content: center; gap: 10px; margin-top: 4px; animation: fadeUp .5s 2s var(--ease) both; flex-wrap: wrap; }
.bp-acc .btn.sec { background: rgba(255, 255, 255, .95); }
.bp-sello {
  position: absolute; right: 22px; bottom: 18px; border: 3px solid var(--ok); color: var(--ok); border-radius: 10px;
  padding: 4px 10px; font-weight: 800; letter-spacing: .15em; font-size: 13px; transform: rotate(-12deg);
  animation: sello .5s 2.1s cubic-bezier(.3, 1.6, .5, 1) both; background: rgba(255, 255, 255, .8);
}
@keyframes sello { from { opacity: 0; transform: rotate(-12deg) scale(2.2); } to { opacity: .9; transform: rotate(-12deg) scale(1); } }
.confeti { position: fixed; top: -10px; width: 8px; height: 14px; z-index: 61; border-radius: 2px; animation: caer linear forwards; pointer-events: none; }
@keyframes caer { to { transform: translateY(110vh) rotate(720deg); opacity: .2; } }

/* mini boarding pass en "Mis vuelos" */
.mini-bp {
  display: grid; grid-template-columns: 1fr 120px; border-radius: 14px; overflow: hidden; border: 1px solid var(--borde);
  background: #fff; box-shadow: var(--sombra); cursor: pointer; transition: transform .3s var(--ease), box-shadow .3s;
}
.mini-bp:hover { transform: translateY(-4px) rotate(-.4deg); box-shadow: var(--sombra-2); }
.mini-bp .top { background: linear-gradient(110deg, var(--navy), var(--azul) 60%, var(--celeste)); color: #fff; padding: 8px 14px; font-size: 11px; font-weight: 800; letter-spacing: .14em; display: flex; justify-content: space-between; }
.mini-bp .cuerpo { padding: 12px 14px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 12px; }
.mini-bp .cuerpo small { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.mini-bp .cuerpo span { font-weight: 700; font-size: 13.5px; }
.mini-bp .stub { background: var(--celeste-claro); border-left: 2px dashed #9fc6e8; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; gap: 6px; text-align: center; }
.mini-bp .stub .hora { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 20px; font-weight: 700; color: var(--azul); }
.mini-bp .stub .barcode { height: 30px; width: 100%; }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .grid-2 { grid-template-columns: 1fr; }
  .topbar-inner { flex-wrap: wrap; }
  .tabs { order: 3; width: 100%; margin-left: 0; }
  .user-chip { margin-left: auto; }
  .user-chip .nombre { display: none; }
}
@media (max-width: 640px) {
  main { padding-top: 18px; }
  .hero { padding: 22px 20px; }
  .hero h2 { font-size: 22px; }
  .form-grid, .ficha { grid-template-columns: 1fr; }
  .vuelo { grid-template-columns: 70px 1fr; }
  .vuelo-acc { grid-column: 1 / -1; justify-content: flex-start; }
  .bp { grid-template-columns: 1fr; }
  .bp-stub { border-left: 0; border-top: 2px dashed #9fc6e8; }
  .bp-stub::before, .bp-stub::after { top: -13px; left: auto; bottom: auto; }
  .bp-stub::before { left: -12px; }
  .bp-stub::after { right: -12px; }
  .bp-campos { grid-template-columns: repeat(2, 1fr); padding: 14px 18px 18px; }
  .bp-ruta { padding: 18px 18px 4px; }
  .bp-ruta .cod { font-size: 30px; }
  .bp-sello { display: none; }
  .mini-grid { grid-template-columns: 1fr; }
  .login-card { padding: 28px 22px 22px; }
}
@media print {
  body * { visibility: hidden; }
  .bp, .bp * { visibility: visible; }
  .bp { position: absolute; left: 0; top: 0; width: 100%; animation: none; box-shadow: none; border: 1px solid #ccc; }
}
/* ---------- v2: tokens de libro ---------- */
:root {
  --papel: #fbfaf6;
  --papel-2: #f3f1ea;
  --tinta: #1b2a3a;
  --tinta-2: #4a5a6b;
  --regla: #d9dfe6;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --mb: #0b7a59;
  --b: #1565c0;
  --r: #b4541a;
}

/* selector de tipo de reserva */
.segmento { display: inline-flex; background: #fff; border: 1.5px solid var(--borde); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 20px; flex-wrap: wrap; }
.segmento button { border: 0; background: transparent; padding: 9px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; color: var(--muted); transition: background .25s, color .25s; }
.segmento button.on { background: linear-gradient(135deg, var(--azul), var(--azul-2)); color: #fff; box-shadow: 0 6px 14px -8px rgba(21, 101, 192, .8); }

.aviso { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--celeste-claro); border: 1px solid #c4e1f7; margin-bottom: 18px; font-size: 14px; }
.aviso.warn { background: #fff8e6; border-color: #f1dca6; }
.aviso strong { display: block; margin-bottom: 2px; }
.aviso ul { margin: 6px 0 0; padding-left: 18px; }

.proxima { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.proxima .codigo { font-family: var(--serif); font-size: 30px; font-weight: 700; color: var(--navy); background: var(--papel); border: 1px solid var(--regla); border-radius: 12px; padding: 10px 14px; line-height: 1; }

.clase-card { display: grid; grid-template-columns: 90px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; border: 1px solid var(--borde); border-radius: 14px; background: #fff; transition: transform .25s var(--ease), box-shadow .25s, border-color .2s; }
.clase-card + .clase-card { margin-top: 10px; }
.clase-card:hover { transform: translateY(-2px); box-shadow: var(--sombra); }
.clase-card.sugerida { border-color: var(--celeste); box-shadow: 0 0 0 3px rgba(79, 195, 247, .18); }
.clase-card .teo { font-family: var(--serif); font-weight: 700; font-size: 20px; color: var(--navy); text-align: center; background: var(--papel); border: 1px solid var(--regla); border-radius: 10px; padding: 10px 4px; }

/* ---------- LIBRO DEL SYLLABUS ---------- */
.libro { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 22px; align-items: start; }
.libro > * { min-width: 0; }
.indice { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); background: #fff; border: 1px solid var(--borde); border-radius: var(--radius); box-shadow: var(--sombra); overflow: hidden; }
.indice-head { padding: 16px 18px 10px; border-bottom: 1px solid var(--borde); }
.indice-head h3 { font-family: var(--serif); font-size: 17px; }
.indice-lista { max-height: 62vh; overflow-y: auto; padding: 6px 0 10px; }
.indice-grupo { padding: 12px 18px 4px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.indice-item { display: grid; grid-template-columns: 12px 52px 1fr; gap: 8px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 7px 18px; cursor: pointer; font-size: 13px; color: var(--tinta); transition: background .2s; }
.indice-item:hover { background: var(--celeste-claro); }
.indice-item.on { background: var(--celeste-claro); box-shadow: inset 3px 0 0 var(--azul-2); }
.indice-item .cod { font-family: var(--serif); font-weight: 700; }
.indice-item .tit { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tinta-2); }
.punto { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--regla); background: #fff; }
.punto.aprobada { background: var(--mb); border-color: var(--mb); }
.punto.repetir { background: var(--r); border-color: var(--r); }
.punto.actual { border-color: var(--azul-2); box-shadow: 0 0 0 3px rgba(30, 136, 229, .2); }
.indice-select { display: none; }

.libro-escena { perspective: 2200px; }
.hoja {
  position: relative; background: var(--papel); color: var(--tinta);
  border-radius: 4px 14px 14px 4px; padding: 44px 52px 34px 64px; min-height: 640px;
  box-shadow: 0 1px 0 var(--regla), 0 24px 50px -24px rgba(10, 37, 64, .45), inset 18px 0 22px -18px rgba(10, 37, 64, .25);
  transform-origin: left center;
}
.hoja::before { content: ''; position: absolute; left: 34px; top: 0; bottom: 0; width: 1px; background: #e6b9b9; opacity: .6; }
.hoja.pasar-adelante { animation: pasarA .55s var(--ease) both; }
.hoja.pasar-atras { animation: pasarB .55s var(--ease) both; }
@keyframes pasarA { from { transform: rotateY(-14deg) translateX(18px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pasarB { from { transform: rotateY(10deg) translateX(-18px); opacity: 0; } to { transform: none; opacity: 1; } }
.membrete { display: flex; justify-content: space-between; gap: 12px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-2); border-bottom: 2px solid var(--tinta); padding-bottom: 8px; margin-bottom: 22px; flex-wrap: wrap; }
.hoja h2.leccion { font-family: var(--serif); font-size: 42px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
.hoja .titulo-leccion { font-family: var(--serif); font-size: 20px; font-weight: 600; margin-top: 8px; text-wrap: balance; }
.hoja .etapa { font-size: 12.5px; color: var(--tinta-2); margin-top: 10px; font-style: italic; font-family: var(--serif); }
.hoja h4 { font-family: var(--serif); font-size: 15px; margin: 24px 0 8px; font-weight: 700; letter-spacing: .02em; }
.hoja ul.lista { margin: 0; padding-left: 20px; font-family: var(--serif); font-size: 15px; line-height: 1.55; }
.hoja ul.lista li + li { margin-top: 3px; }
.ficha-leccion { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; font-size: 13px; color: var(--tinta-2); }
.ficha-leccion b { color: var(--tinta); }
.sello-libro { position: absolute; top: 86px; right: 46px; border: 3px double currentColor; padding: 6px 14px; font-weight: 800; letter-spacing: .18em; font-size: 13px; transform: rotate(-7deg); border-radius: 6px; opacity: .85; text-transform: uppercase; animation: sello .5s .25s cubic-bezier(.3, 1.6, .5, 1) both; }
.sello-libro.aprobada { color: var(--mb); }
.sello-libro.repetir { color: var(--r); }
.sello-libro.pendiente { color: var(--tinta-2); border-style: dashed; animation: none; }
.planilla-wrap { overflow-x: auto; margin-top: 6px; }
table.planilla { width: 100%; border-collapse: collapse; font-size: 13.5px; background: #fff; }
.planilla th, .planilla td { border: 1px solid var(--regla); padding: 7px 9px; }
.planilla thead th { background: var(--papel-2); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-2); text-align: center; white-space: nowrap; }
.planilla thead th:first-child { text-align: left; }
.planilla td.n { text-align: center; width: 64px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; }
.planilla td.n.MB { color: var(--mb); background: #eef8f3; }
.planilla td.n.B { color: var(--b); background: #eef4fc; }
.planilla td.n.R { color: var(--r); background: #fbf0e8; }
.planilla .sec td { background: var(--papel-2); font-weight: 700; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); }
.observaciones-libro { margin-top: 20px; border-top: 1px solid var(--regla); }
.observaciones-libro .obs { padding: 10px 0; border-bottom: 1px dashed var(--regla); font-family: var(--serif); font-size: 14.5px; }
.observaciones-libro .obs small { display: block; font-family: 'Barlow', system-ui, sans-serif; font-size: 11.5px; color: var(--tinta-2); letter-spacing: .04em; }
.pie-hoja { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--regla); font-size: 12px; color: var(--tinta-2); flex-wrap: wrap; }
.leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--tinta-2); margin-top: 10px; }
.leyenda span b { font-family: 'JetBrains Mono', ui-monospace, monospace; }

/* tapa */
.tapa {
  position: relative; border-radius: 6px 16px 16px 6px; padding: 54px 48px; min-height: 640px; color: #e9f3fb; overflow: hidden;
  background: linear-gradient(160deg, #0b2440, #0f3460 70%, #123d6f);
  box-shadow: 0 30px 60px -26px rgba(10, 37, 64, .7), inset 22px 0 26px -16px rgba(0, 0, 0, .55);
  display: flex; flex-direction: column;
}
.tapa::after { content: ''; position: absolute; inset: 18px; border: 1px solid rgba(129, 212, 250, .35); border-radius: 4px 10px 10px 4px; pointer-events: none; }
.tapa .escudo { width: 64px; height: 64px; border: 1.5px solid rgba(129, 212, 250, .6); border-radius: 50%; display: grid; place-items: center; color: var(--celeste-2); }
.tapa .escudo svg { width: 30px; transform: rotate(45deg); }
.tapa h2 { font-family: var(--serif); font-size: 40px; font-weight: 600; line-height: 1.1; margin-top: 28px; color: #fff; text-wrap: balance; }
.tapa .sub { font-family: var(--serif); font-style: italic; color: var(--celeste-2); font-size: 17px; margin-top: 10px; }
.tapa .datos { margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 26px; position: relative; z-index: 1; }
.tapa .datos small { display: block; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--celeste-2); }
.tapa .datos span { font-family: var(--serif); font-size: 17px; color: #fff; }
.progreso-tapa { display: grid; gap: 12px; margin: 36px 0; position: relative; z-index: 1; max-width: 460px; }
.progreso-tapa .fila { display: grid; grid-template-columns: 110px 1fr 54px; gap: 10px; align-items: center; font-size: 13px; }
.progreso-tapa .barra { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, .14); overflow: hidden; }
.progreso-tapa .barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--celeste), #fff); border-radius: 6px; transition: width 1.2s var(--ease); }
.reglas-libro { font-family: var(--serif); font-size: 14.5px; line-height: 1.6; }

/* calificación (modal de cierre) */
.calif { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.calif td { padding: 7px 6px; border-bottom: 1px solid #edf2f7; vertical-align: middle; }
.calif .sec td { padding-top: 14px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 0; }
.notas { display: inline-flex; gap: 4px; }
.notas button { width: 38px; padding: 6px 0; border-radius: 8px; border: 1.5px solid var(--borde); background: #fff; font-weight: 800; font-size: 12px; cursor: pointer; transition: all .15s; font-family: 'JetBrains Mono', ui-monospace, monospace; }
.notas button[data-v="MB"].on { background: var(--mb); border-color: var(--mb); color: #fff; }
.notas button[data-v="B"].on { background: var(--b); border-color: var(--b); color: #fff; }
.notas button[data-v="R"].on { background: var(--r); border-color: var(--r); color: #fff; }
.resultado { padding: 12px 14px; border-radius: 12px; font-weight: 700; font-size: 14px; margin-top: 14px; }
.resultado.ok { background: #e6f6ef; color: var(--mb); }
.resultado.no { background: #fbeee4; color: var(--r); }
.resultado.inc { background: #f1f4f8; color: var(--muted); }

/* disponibilidad */
.dispo { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.dispo th { position: sticky; top: 0; background: #fff; z-index: 1; }
.dispo th, .dispo td { padding: 8px 6px; border-bottom: 1px solid #edf2f7; text-align: center; }
.dispo td:first-child, .dispo th:first-child { text-align: left; min-width: 150px; }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; min-width: 118px; }
.chip { border: 1px solid var(--borde); background: #fff; color: var(--muted); border-radius: 6px; font-size: 10px; font-weight: 700; padding: 4px 0; cursor: pointer; font-family: 'JetBrains Mono', ui-monospace, monospace; transition: all .15s; }
.chip.on { background: var(--azul-2); border-color: var(--azul-2); color: #fff; }
.chip.ocupado { background: var(--navy); border-color: var(--navy); color: #fff; cursor: help; }
.chip:disabled { cursor: default; }
.dia-head small { display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.dia-head.hoy { color: var(--azul); }
.dia-acc { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
.dia-acc button { border: 0; background: none; color: var(--azul); font-size: 11px; font-weight: 700; cursor: pointer; padding: 0 2px; }

/* mantenimiento */
.estado-nov { font-size: 11px; }
.flujo { display: flex; gap: 6px; flex-wrap: wrap; }
.filtro { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filtro select, .filtro input { width: auto; padding: 8px 12px; }

.agenda-hoy { display: grid; gap: 8px; }
.agenda-fila { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #f7fbff; border: 1px solid #e3eef8; align-items: center; }
.agenda-fila .mono { color: var(--azul); }

@media (max-width: 960px) {
  .libro { grid-template-columns: 1fr; }
  .indice { position: static; }
  .indice-lista { display: none; }
  .indice-select { display: block; padding: 0 18px 16px; }
}
@media (max-width: 640px) {
  .hoja { padding: 28px 18px 24px 30px; min-height: 0; }
  .hoja::before { left: 16px; }
  .hoja h2.leccion { font-size: 32px; }
  .sello-libro { position: static; display: inline-block; margin: 4px 0 14px; }
  .tapa { padding: 36px 26px; min-height: 0; }
  .tapa h2 { font-size: 30px; }
  .tapa .datos { grid-template-columns: 1fr; }
  .clase-card { grid-template-columns: 64px 1fr; }
  .clase-card > :last-child { grid-column: 1 / -1; }
  .proxima { grid-template-columns: 1fr; }
}
/* ---------- meteorología ---------- */
.metar-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }

.metar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.metar-grid > div { background: var(--celeste-claro); border-radius: 12px; padding: 10px 12px; }
.metar-grid small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.metar-grid span { display: block; font-weight: 700; font-size: 15px; color: var(--navy); margin-top: 2px; }

.chip-ad { border: 1px solid var(--borde); background: #fff; border-radius: 999px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; color: var(--text); transition: background .2s, border-color .2s; }
.chip-ad:hover { background: var(--celeste-claro); border-color: var(--celeste); }

.hero select, .hero input { color: var(--text); }

.buscador-of { display: grid; grid-template-columns: 180px 1fr; gap: 14px; align-items: end; }

@media (max-width: 640px) { .buscador-of { grid-template-columns: 1fr; } .buscador-of .btn { flex: 1 1 100%; } }

.roles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.rol-op { align-items: flex-start; padding: 16px; }

/* logo oficial */
.brand { display: flex; align-items: center; gap: 12px; }

.brand small { display: block; padding-left: 12px; border-left: 1px solid rgba(255, 255, 255, .3); color: var(--celeste-2); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3; max-width: 130px; }
.brand-claro .brand-img { height: 40px; }
.brand-claro small { border-left-color: var(--borde); color: var(--muted); }
.login-card .brand { flex-direction: column; align-items: flex-start; gap: 8px; }

.bp-head .brand-img { height: 26px; }
.tapa-logo { height: 34px; width: auto; align-self: flex-start; }

/* estado de cuenta */
.movs .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.movs th.num { text-align: right; }
.movs .pago { color: var(--ok); }

.tarifas { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.tarifas > div { background: var(--celeste-claro); border-radius: 12px; padding: 12px 14px; }
.tarifas small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.tarifas em { display: block; font-style: normal; font-size: 12px; color: var(--muted); }
.resumen-reserva { flex-wrap: wrap; }

/* avisos: email y WhatsApp */
.msj-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: start; }
.msj-canal { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.mail { border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; background: #eef3f8; }
.mail-meta { background: #fff; padding: 10px 14px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--borde); display: grid; gap: 2px; }
.mail-meta b { color: var(--text); }
.mail-cuerpo { margin: 16px; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(10, 37, 64, .08); }
.mail-head { background: var(--navy); padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.mail-head img { height: 26px; }
.mail-head span { color: var(--celeste-2); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }

.mail-main p { margin: 0 0 10px; }

.mail-tabla td { padding: 9px 12px; border-bottom: 1px solid #e6edf4; }
.mail-tabla td:first-child { color: var(--muted); width: 45%; }
.mail-tabla td:last-child { font-weight: 600; color: var(--navy); }
.mail-tabla tr.total td { background: #fff8e6; font-size: 16px; font-weight: 800; color: #8a5a00; }
.mail-notas { background: var(--celeste-claro); border-left: 3px solid var(--azul-2); padding: 12px 14px; margin: 16px 0; font-family: 'Barlow', system-ui, sans-serif; font-size: 13.5px; }
.mail-notas p { margin: 0 0 4px; }

.mail-main .firma { font-weight: 600; }
.mail-pie { background: #f5f8fb; padding: 12px 22px; font-size: 11.5px; color: var(--muted); }
.wpp { border-radius: 12px; overflow: hidden; border: 1px solid var(--borde); }
.wpp-top { background: #075e54; color: #fff; display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.wpp-top img { width: 38px; height: 38px; object-fit: contain; background: var(--navy); border-radius: 50%; padding: 6px; }
.wpp-top small { display: block; opacity: .8; font-size: 11.5px; }
.wpp-chat { background: #e5ddd5; padding: 18px 14px 22px; min-height: 260px; }
.wpp-msg { background: #fff; border-radius: 0 10px 10px 10px; padding: 9px 12px 20px; font-size: 14px; line-height: 1.45; color: #111b21; max-width: 92%; position: relative; box-shadow: 0 1px 1px rgba(0, 0, 0, .12); }
.wpp-hora { position: absolute; right: 10px; bottom: 4px; font-size: 11px; color: #667781; }
@media (max-width: 860px) { .msj-grid { grid-template-columns: 1fr; } }
.modal-bg { z-index: 70; }

.notam { border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
.notam pre { white-space: pre-wrap; word-break: break-word; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; margin: 6px 0 0; }

/* asistencia por QR */
.llegada { animation: pop .5s var(--ease) both; }
.llegada-escena { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 50% 35%, rgba(18, 163, 122, .85), rgba(10, 37, 64, .95)); animation: fadeIn .3s both; }
.llegada-card { background: #fff; border-radius: 22px; padding: 30px 26px 24px; width: min(440px, 100%); text-align: center; box-shadow: var(--sombra-2); animation: pop .6s .1s var(--ease) both; }
.llegada-check { width: 84px; height: 84px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; margin: 0 auto 14px; animation: pop .6s .3s cubic-bezier(.3, 1.6, .5, 1) both; }

.llegada-item { text-align: left; background: var(--celeste-claro); border-radius: 12px; padding: 10px 14px; margin-top: 8px; font-size: 14px; }
.qr-caja { display: grid; place-items: center; gap: 10px; padding: 18px; border: 2px dashed var(--borde); border-radius: 16px; background: #fff; }

@media print {
  body.imprimiendo-qr * { visibility: hidden; }
  body.imprimiendo-qr .qr-imprimible, body.imprimiendo-qr .qr-imprimible * { visibility: visible; }
  body.imprimiendo-qr .qr-imprimible { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px; text-align: center; background: #fff; }
  body.imprimiendo-qr .qr-imprimible #qr-dibujo svg { width: 11cm !important; height: 11cm !important; }
}

/* habilitaciones */

.hab-caja legend { padding: 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); }
.hab-caja small.lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--navy-2); margin-bottom: 6px; }

/* casillas de opción */

.marca { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--borde); border-radius: 10px; padding: 7px 12px; font-size: 13.5px; cursor: pointer; background: #fff; }

.portal-ico { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, var(--azul), var(--celeste)); color: #fff; display: grid; place-items: center; margin-bottom: 6px; }

.cambio-portal { background: rgba(255, 255, 255, .14); color: #fff; border: 1px solid rgba(255, 255, 255, .25); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; transition: background .2s; }
.cambio-portal:hover { background: rgba(255, 255, 255, .24); }

/* campus */
.prox-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.prox-lec { display: flex; gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--borde); background: #fff; border-radius: 14px; padding: 12px 14px; cursor: pointer; transition: transform .25s var(--ease), border-color .2s; }
.prox-lec:hover { transform: translateY(-3px); border-color: var(--celeste); }
.prox-lec strong { display: block; font-size: 14px; }
.prox-lec small { color: var(--muted); font-size: 12px; }
.codigo-lec { font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--navy); background: var(--papel); border: 1px solid var(--regla); border-radius: 10px; padding: 8px 10px; white-space: nowrap; }

.tp { display: flex; justify-content: space-between; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid #edf2f7; flex-wrap: wrap; }

.tp-info { min-width: 0; flex: 1 1 320px; }
.tp-comentario { margin-top: 6px; font-size: 13.5px; background: var(--celeste-claro); border-radius: 8px; padding: 8px 10px; }

/* foro */

.tema:hover { background: #f7fbff; }

.post-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.post-texto { margin-top: 10px; font-size: 15px; line-height: 1.6; word-break: break-word; }
.post-acc { margin-top: 10px; gap: 14px; }
.link-btn.peligro { color: var(--danger); }
.responder { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--borde); display: grid; gap: 10px; }
.foro-filtro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 220px) auto; gap: 10px; align-items: center; margin-bottom: 12px; }
.foro-filtro > * { min-width: 0; width: 100%; }
@media (max-width: 760px) { .foro-filtro { grid-template-columns: minmax(0, 1fr); } .foro-filtro .segmento { display: flex; } .foro-filtro .segmento button { flex: 1; } }

/* app instalada sin conexión */
.sin-red { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: linear-gradient(160deg, var(--navy), var(--azul)); }
.sin-red-caja { background: #fff; border-radius: 22px; padding: 28px 24px; max-width: 380px; width: 100%; text-align: center; display: grid; gap: 10px; justify-items: center; box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .5); }
.sin-red-caja h2 { color: var(--navy); margin-top: 6px; }

/* ausencias */
.btn.warn-btn { background: #fff4e0; color: #8a5300; border: 1px solid #f3cf8c; box-shadow: none; }
.btn.warn-btn:hover { background: #ffe9c2; }
.opciones-aus { display: grid; gap: 8px; }
.op-aus { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--borde); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.op-aus:has(input:checked) { border-color: var(--azul-2); background: #f4f9ff; }
.op-aus input { margin-top: 3px; width: auto; flex: none; box-shadow: none; }
.op-aus span { display: grid; gap: 2px; }
.op-aus small { color: var(--muted); }

/* nacionalidad y tutores */
.tutor-caja { border-color: #f3cf8c; background: #fffaf0; }
.tutor-caja legend { color: #8a5300; }
.aviso-perfil { background: #fff4e0; border: 1px solid #f3cf8c; color: #6b4300; border-radius: 14px; padding: 14px 18px; margin-bottom: 18px; }
.tutor-ficha { background: #fffaf0; border-radius: 10px; padding: 8px 10px; }

/* foto de perfil */
.avatar.con-foto { padding: 0; overflow: hidden; background: #dbe6f1; }
.avatar.con-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto-oblig { background: #fff; color: var(--texto); border-radius: 24px; padding: 32px 28px; max-width: 520px; margin: 0 auto; text-align: center; display: grid; gap: 14px; justify-items: center; box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .5); }
.foto-oblig h2 { color: var(--navy); font-size: 24px; }
.foto-oblig p { color: var(--muted); margin: 0; line-height: 1.5; }
.foto-prev { width: 140px; height: 140px; border-radius: 50%; display: grid; place-items: center; font-size: 44px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--azul), var(--celeste)); overflow: hidden; border: 4px solid var(--celeste-claro); }
.foto-prev img { width: 100%; height: 100%; object-fit: cover; }
.foto-card { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }

/* asistencia de instructores */
.llegada-check.tarde { background: linear-gradient(135deg, #f59e0b, #d97706); font-size: 46px; font-weight: 800; color: #fff; }

</style>

  // ---------- cuentas: tarifas y movimientos ----------
  const TARIFAS_INICIALES = { vuelo: 196000, simulador: 36000, teorica: 26000, recargo: 20, horas_aviso: 24, ausencia: 100 };
  function reconstruirCuentas(d) {
    d.tarifas = d.tarifas || { ...TARIFAS_INICIALES };
    d.movimientos = []; d.seq.m = 0;
    const T = d.tarifas;
    const mov = (usuario_id, fecha, concepto, tipo, importe, ref) => d.movimientos.push({ id: ++d.seq.m, usuario_id, fecha, concepto, tipo, importe: Math.round(importe), ref });
    for (const r of d.reservas.filter((x) => x.estado === 'completado')) {
      const rec = d.recursos.find((x) => x.id === r.recurso_id);
      mov(r.piloto_id, r.fecha, `${r.tipo === 'vuelo' ? 'Vuelo' : 'Simulador'} ${rec?.nombre || ''} · ${String(r.horas).replace('.', ',')} h${r.leccion ? ` · ${r.leccion}` : ''}`, 'cargo', (r.horas || 0) * T[r.tipo], `res:${r.id}`);
    }
    for (const r of d.reservas.filter((x) => x.estado === 'ausente' && !x.ausencia?.justificada)) {
      mov(r.piloto_id, r.fecha, `Ausencia sin aviso · ${r.tipo === 'vuelo' ? 'vuelo' : 'simulador'} ${r.fecha.split('-').reverse().join('/')} ${String(r.bloque).padStart(2, '0')}:00 (${T.ausencia ?? 100}% del bloque)`, 'cargo', (r.tipo === 'teorica' ? T.teorica : T[r.tipo] * 2) * (T.ausencia ?? 100) / 100, `aus:${r.id}`);
    }
    for (const i of d.inscripciones.filter((x) => x.estado === 'presente')) {
      const c = d.clases.find((x) => x.id === i.clase_id);
      mov(i.alumno_id, c.fecha, `Clase teórica ${c.teo}`, 'cargo', T.teorica, `cla:${i.id}`);

    const h = hoy(); const desde = dia(-dias); const fechas = new Set();
    for (const r of db.reservas) if (r.instructor_id === id && r.estado !== 'cancelado' && r.fecha >= desde && r.fecha <= h) fechas.add(r.fecha);
    for (const c of db.clases) if (c.instructor_id === id && c.estado !== 'cancelada' && c.fecha >= desde && c.fecha <= h) fechas.add(c.fecha);
    for (const a of db.asistencia_inst) if (a.instructor_id === id && a.fecha >= desde) fechas.add(a.fecha);
    const ahoraMin = new Date().getHours() * 60 + new Date().getMinutes(); const tol = db.config.tolerancia_inst ?? 10;
    const filas = [...fechas].sort().reverse().map((f) => {
      const reg = db.asistencia_inst.find((a) => a.instructor_id === id && a.fecha === f);
      const acts = actividadesInst(id, f); const primer = reg?.primer_bloque ?? acts[0]?.bloque;
      if (reg) return { fecha: f, estado: reg.tarde ? 'tarde' : 'a_tiempo', hora: reg.hora, primer_bloque: primer, minutos_tarde: reg.minutos_tarde, actividades: acts.length };

    }).filter(Boolean);

  api.registrarLlegada = (codigo, pos) => {

      const m = distancia(db.config.lat, db.config.lon, Number(pos.lat), Number(pos.lon));
      if (m > db.config.radio + Math.min(Number(pos.precision) || 0, 300)) fail(`Estás a ${(m / 1000).toFixed(1).replace('.', ',')} km de la escuela. La llegada se registra solo estando en el aeródromo.`);
    }
    const h = hoy(); const ahoraH = new Date(); const min = ahoraH.getHours() * 60 + ahoraH.getMinutes();
    const enVentana = (b) => min >= b * 60 - 90 && min < (b + 2) * 60; // desde 1 h 30 antes hasta el final del bloque

    if (u.rol === 'instructor') return llegadaInstructor(u, h, min, hora);
    const items = [];
    const res = db.reservas.filter((r) => r.piloto_id === u.id && r.fecha === h && r.estado === 'pendiente' && enVentana(r.bloque));
    // si tiene varios bloques seguidos, queda presente en todos

    const marcar = new Set(res.map((r) => r.id));
    for (const r of res) for (const x of bloquesHoy) if (x.recurso_id === r.recurso_id && x.bloque > r.bloque && x.bloque <= r.bloque + 6) marcar.add(x.id);

        var b2 = read();

      var bytes = [];

        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

function paseDeReservas(reservas) {
  const r = reservas[0]; const bl = reservas.map((x) => x.bloque).sort((a, b) => a - b);
  const contiguo = bl.every((b, i) => !i || b === bl[i - 1] + 2);
  const lec = r.estado === 'pendiente' ? r.leccion_sugerida || null : r.leccion;
  return { llegada: r.llegada || null, reservaId: r.id, tipo: r.tipo, codigo: codigoReserva(r.id, r.tipo === 'simulador' ? 'SIM' : 'FC'), destino: r.tipo === 'simulador' ? 'SIM' : (r.destino || 'MOR'), local: r.tipo === 'vuelo' && (r.destino || 'MOR') === 'MOR',
    salida: bl[0], regreso: bl.at(-1) + 2, horario: contiguo ? `${hh(bl[0])} – ${hh(bl.at(-1) + 2)}` : bl.map(rango).join(', '),
    piloto: r.piloto, clase: r.piloto_rol === 'ppa' ? 'PPA' : 'ALUMNO', fecha: r.fecha, recursoLbl: r.tipo === 'simulador' ? 'Simulador' : 'Aeronave', recurso: r.recurso,
    extraLbl: lec ? 'Lección' : 'Modelo', extra: lec || r.modelo, instructor: r.instructor || 'Sin instructor', bloques: `${bl.length} × 2 hs`, estado: r.estado };
}
function paseDeClase(k) {
  return { tipo: 'teorica', codigo: codigoReserva(k.id, 'TEO'), destino: 'AULA', salida: k.bloque, regreso: k.bloque + 2, horario: rango(k.bloque),
    piloto: `${state.user.nombre} ${state.user.apellido}`, clase: 'ALUMNO', fecha: k.fecha, recursoLbl: 'Aula', recurso: k.aula,
    extraLbl: 'Clase', extra: k.teo, instructor: k.instructor, bloques: '1 × 2 hs', estado: 'pendiente', titulo: k.titulo };
}
function boardingPass(p, { celebrar = false } = {}) {
  const sello = p.estado === 'completado' ? 'COMPLETADO' : p.estado === 'cancelado' ? 'CANCELADO' : p.estado === 'ausente' ? 'AUSENTE' : 'CONFIRMADO';

  const e = document.createElement('div'); e.className = 'bp-escena';

VISTAS.reservas = async function vistaMisReservas(v) {
  const todas = await Store.misReservas(); const hoy = isoLocal(new Date());
  const grupos = new Map();
  for (const r of todas.filter((x) => x.estado === 'pendiente' && x.fecha >= hoy)) {
    const k = `${r.tipo}|${r.fecha}|${r.recurso_id}|${r.instructor_id}`; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(r);
  }
  const empezo = (f, b) => f < hoy || (f === hoy && new Date().getHours() >= b);
  const prox = [...grupos.values()].map((g) => g.sort((a, b) => a.bloque - b.bloque)).sort((a, b) => (a[0].fecha + hh(a[0].bloque)).localeCompare(b[0].fecha + hh(b[0].bloque)));
  const clases = state.user.rol === 'alumno' ? await Store.misClases() : [];
  const clasesProx = clases.filter((k) => k.estado === 'programada' && k.inscripcion.estado === 'inscripto');
  const pasados = todas.filter((r) => !(r.estado === 'pendiente' && r.fecha >= hoy));
  v.innerHTML = hero('Mis reservas', 'Tus próximos vuelos, turnos de simulador y clases, cada uno con su pase. Tocá un pase para verlo completo.') + `
    <div class="card anim" style="--i:1"><div class="card-head"><h3>Próximas</h3><span class="badge">${prox.length + clasesProx.length}</span></div>
      ${prox.length || clasesProx.length ? `<div class="mini-grid">${prox.map((g, i) => miniPass({ ...paseDeReservas(g), empezo: empezo(g[0].fecha, g[0].bloque) }, i, `g${i}`)).join('')}${clasesProx.map((k, i) => miniPass(paseDeClase(k), prox.length + i, `c${k.id}`)).join('')}</div>` : vacio('No tenés reservas próximas.')}</div>
    <div class="card anim" style="--i:2"><div class="card-head"><h3>Anteriores y canceladas</h3></div>
      ${pasados.length || clases.length - clasesProx.length ? `<div class="tabla-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Horario</th><th>Equipo</th><th>Instructor</th><th>Lección</th><th>Estado</th></tr></thead><tbody>
      ${pasados.map((r) => `<tr><td>${esc(fmtCorta(r.fecha))}</td><td>${badgeTipo(r.tipo)}</td><td class="mono">${rango(r.bloque)}</td><td class="mono">${esc(r.recurso)}</td>
        <td>${esc(r.instructor || 'Solo')}</td><td>${esc(r.leccion || '—')}</td><td>${badgeEstado(r)}</td></tr>`).join('')}
      ${clases.filter((k) => !clasesProx.includes(k)).map((k) => `<tr><td>${esc(fmtCorta(k.fecha))}</td><td>${badgeTipo('teorica')}</td><td class="mono">${rango(k.bloque)}</td><td>${esc(k.aula)}</td>
        <td>${esc(k.instructor)}</td><td>${esc(k.teo)}</td><td>${k.inscripcion.estado === 'presente' ? `<span class="badge ok">Presente${k.inscripcion.nota ? ` · ${NOTA[k.inscripcion.nota]}` : ''}</span>` : k.estado === 'cancelada' ? '<span class="badge gris">Clase cancelada</span>' : '<span class="badge gris">Ausente</span>'}</td></tr>`).join('')}
      </tbody></table></div>` : vacio('Todavía no hay actividad anterior.')}</div>`;
  $$('.mini-bp', v).forEach((el) => {
    const id = el.dataset.g;
    const pase = id.startsWith('g') ? paseDeReservas(prox[Number(id.slice(1))]) : paseDeClase(clasesProx.find((k) => `c${k.id}` === id));
    el.onclick = (e) => { if (!e.target.closest('[data-cancelar]')) boardingPass(pase); };
    const bc = $('[data-cancelar]', el); if (bc) bc.onclick = async () => {
      const grupo = id.startsWith('g') ? prox[Number(id.slice(1))] : null;
      const info = grupo ? await Store.infoCancelacion(grupo.map((r) => r.id)) : await Store.infoCancelacion(id.slice(1), 'teorica');
      if (!(await confirmar('Cancelar reserva', `¿Cancelar ${TIPO_RES[pase.tipo].toLowerCase()} del ${fmtFecha(pase.fecha)} (${pase.horario})? ${textoCargo(info)}`, info.cargo ? `Cancelar y pagar ${plata(info.cargo)}` : 'Sí, cancelar'))) return;
      const cargo = await hacer(async () => { if (!grupo) return await Store.darseDeBaja(id.slice(1)); return await Store.cancelarReservas(grupo.map((r) => r.id)); });
      if (cargo !== undefined) toast(cargo ? `Cancelada. Se cargó ${plata(cargo)} a tu estado de cuenta.` : 'Reserva cancelada sin cargo', 'ok');
      await VISTAS.reservas(v);
    };
  });
};

    ${h.horas_previas ? `<p class="muted anim" style="margin:-8px 0 18px">Incluye ${fmtHoras(h.horas_previas)} hs previas cargadas por la administración.</p>` : ''}
    ${esPPA ? '' : `<p class="muted anim" style="margin:-8px 0 18px">Para pedir examen ANAC: 40 hs de vuelo y mínimo 10 vuelos solo. Llevás ${fmtHoras(h.horas_totales)} hs.</p>`}
    <div class="grid-2">
      <div class="card anim" style="--i:6"><div class="card-head"><h3>Horas de vuelo por mes</h3><span class="muted">Últimos 6 meses</span></div>
        <div class="chart">${meses.map((m, i) => `<div class="bar-col"><span class="bar-val">${fmtHoras(h.por_mes[m] || 0)}</span><div class="bar" style="--i:${i};height:${((h.por_mes[m] || 0) / maxMes) * 82}%"></div></div>`).join('')}</div>

    </div>
    <div class="card anim" style="--i:8"><div class="card-head"><h3>Libro de vuelo</h3><span class="badge">${filas.length} registros</span></div>

const TRACK_NOMBRE = { teorica: 'Teoría', vuelo: 'Vuelo', simulador: 'Simulador' };

  let data;
  try { data = await Store.syllabus(alumnoId); } catch (e) { cont.innerHTML = `<div class="card">${vacio(esc(e.message))}</div>`; return; }

  const actuales = new Set(['teorica', 'vuelo', 'simulador'].map((t) => data.pistas[t].actual?.id).filter(Boolean));
  let pag = Math.max(0, paginas.indexOf(abrir || 'tapa'));
  const a = data.alumno;

  cont.innerHTML = `<div class="libro">
    <aside class="indice anim"><div class="indice-head"><h3>Índice</h3><div class="muted">${esc(a.nombre)} ${esc(a.apellido)}</div></div>
      <div class="indice-select"><select id="idx-sel" aria-label="Ir a la página">${paginas.map((p, i) => `<option value="${i}">${p === 'tapa' ? 'Tapa' : p === 'reglas' ? 'Normas del curso' : `${p} · ${esc(Store.LECCIONES[p].titulo)}`}</option>`).join('')}</select></div>
      <div class="indice-lista">
        <button class="indice-item" data-p="0"><span class="punto"></span><span class="cod">—</span><span class="tit">Tapa</span></button>
        <button class="indice-item" data-p="1"><span class="punto"></span><span class="cod">—</span><span class="tit">Normas del curso</span></button>
        ${['teorica', 'vuelo', 'simulador'].map((t) => `<div class="indice-grupo"><span>${TRACK_NOMBRE[t]}</span><span>${data.pistas[t].aprobadas}/${data.pistas[t].total}</span></div>
          ${data.pistas[t].lecciones.map((l) => `<button class="indice-item" data-p="${paginas.indexOf(l.id)}"><span class="punto ${l.estado !== 'pendiente' ? l.estado : ''} ${actuales.has(l.id) ? 'actual' : ''}"></span>

      </div></aside>
    <div class="libro-escena" id="escena"></div></div>`;

    $$('[data-p]', esc_).forEach((b) => b.onclick = () => ir(Number(b.dataset.p)));

// ---------- visor de PDF ----------
const cargarScript = (src) => new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = mal; document.head.append(s); });
let pdfjsListo = null;
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function verDoc(uid, tipo, nombre) {
  const d = await Store.documento(uid, tipo);
  if (!d) return toast('Documento no disponible', 'error');
  const m = modal(`<div class="modal-head"><div><h3>${esc(nombre)}</h3><div class="muted">${esc(d.nombre)} · ${Math.max(1, Math.round(d.tam / 1024))} KB · subido ${esc(fmtCorta(d.fecha.slice(0, 10)))}</div></div><button class="x" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="modal-body"><div class="pdf-view" id="pdfv"><span class="muted">Cargando documento…</span></div></div>`, { ancho: true });
  const c = $('#pdfv', m.el);
  try {
    pdfjsListo = pdfjsListo || cargarScript(PDFJS + 'pdf.min.js').then(() => cargarScript(PDFJS + 'pdf.worker.min.js'));
    await pdfjsListo;
    const bin = atob(d.data.split(',')[1]); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const pdf = await window.pdfjsLib.getDocument({ data: bytes, isEvalSupported: false }).promise; c.innerHTML = '';
    for (let n = 1; n <= Math.min(pdf.numPages, 10); n++) {
      const page = await pdf.getPage(n); const vp = page.getViewport({ scale: 1.5 });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; c.append(cv);
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    }
  } catch { c.innerHTML = '<span class="muted">El documento está cargado, pero no se pudo mostrar la vista previa en este navegador.</span>'; }
}
document.addEventListener('click', async (e) => { const b = e.target.closest('[data-verdoc]'); if (b) { const [uid, tipo, n] = b.dataset.verdoc.split('|'); await verDoc(uid, tipo, n); } });

const turnoEmpezo = (f) => { const h = isoLocal(new Date()); return f.fecha < h || (f.fecha === h && new Date().getHours() >= f.bloque); };
async function marcarAusente(f, despues) {

        <label class="op-aus"><input type="radio" name="aus" value="cargo" checked><span><b>Ausencia sin aviso</b><small>Se cobra el ${t.ausencia ?? 100}% del bloque: ${pesos(valor)}</small></span></label>

    </div><div class="modal-foot"><button class="btn sec" data-cerrar>Volver</button><button class="btn danger" id="aus-ok">Marcar ausente</button></div>`);
  const just = () => $('input[name=aus]:checked', m.el).value === 'just';
  $$('input[name=aus]', m.el).forEach((x) => x.onchange = () => { $('#aus-opc', m.el).textContent = just() ? '(obligatorio)' : '(opcional)'; $('#aus-ok', m.el).textContent = just() ? 'Marcar ausente sin cargo' : `Marcar ausente y cobrar ${pesos(valor)}`; });
  $('#aus-ok', m.el).textContent = `Marcar ausente y cobrar ${pesos(valor)}`;

async function deshacerAusencia(id, despues) {

function badgeLlegada(f) {
  if (f.fecha < isoLocal(new Date()) && f.estado === 'pendiente') return '<span class="badge warn">Sin cerrar</span>';

  const empezo = new Date().getHours() >= f.bloque;
  return empezo ? '<span class="badge danger">No registró llegada</span>' : '<span class="badge gris">Esperando llegada</span>';
}

  const notas = {};
  const m = modal(`<div class="modal-head"><div><h3>Cerrar ${f.tipo === 'vuelo' ? 'vuelo' : 'turno de simulador'}</h3><div class="muted">${esc(f.piloto)} · ${esc(fmtFecha(f.fecha))} · ${rango(f.bloque)} · ${esc(f.recurso)}</div></div><button class="x" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="modal-body" style="display:grid;gap:14px">
      <div class="form-grid"><label class="campo">Horas ${f.tipo === 'vuelo' ? 'de vuelo' : 'de simulador'}<input id="c-horas" type="number" min="0.1" max="4" step="0.1" value="${f.tipo === 'vuelo' ? '1.5' : '1.0'}"></label>
      ${esAlumno ? `<label class="campo">Lección del syllabus<select id="c-lec">${lecs.map((l) => `<option value="${l.id}" ${l.id === lec ? 'selected' : ''}>${l.id} · ${esc(l.titulo)}</option>`).join('')}</select></label>` : ''}</div>
      ${esAlumno ? `<div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><strong>Calificá cada maniobra</strong>
        <span class="flujo"><button class="btn sec sm" data-todas="MB">Todo MB</button><button class="btn sec sm" data-todas="B">Todo B</button></span></div>
        <div id="c-tabla" style="max-height:46vh;overflow:auto;margin-top:8px"></div><div id="c-res"></div></div>` : ''}
      <label class="campo">Observaciones <span class="op">(el ${esAlumno ? 'alumno' : 'piloto'} las ve en su historial)</span><textarea id="c-obs" placeholder="Desempeño, temas a reforzar, recomendaciones…"></textarea></label>
    </div>
    <div class="modal-foot"><button class="btn sec" data-cerrar>Volver</button><button class="btn ok" id="c-ok">Guardar y cerrar</button></div>`, { ancho: true });
  const tabla = () => {
    const l = Store.LECCIONES[lec];
    $('#c-tabla', m.el).innerHTML = `<table class="calif">${l.secciones.map((s, si) => `<tr class="sec"><td colspan="2">${esc(s.titulo)}</td></tr>${s.items.map((it, ii) => { const k = `${si}.${ii}`;
      return `<tr><td>${esc(it)}</td><td style="text-align:right;white-space:nowrap"><span class="notas" data-k="${k}">${['MB', 'B', 'R'].map((n) => `<button type="button" data-v="${n}" class="${notas[k] === n ? 'on' : ''}" title="${NOTA[n]}">${n}</button>`).join('')}</span></td></tr>`; }).join('')}`).join('')}</table>`;
    $$('.notas button', m.el).forEach((b) => b.onclick = () => { const k = b.parentElement.dataset.k; notas[k] = notas[k] === b.dataset.v ? undefined : b.dataset.v; tabla(); });
    const keys = Store.itemKeys(l); const hechas = keys.filter((k) => notas[k]).length; const reg = keys.filter((k) => notas[k] === 'R').length;
    $('#c-res', m.el).innerHTML = reg ? `<div class="resultado no">${reg} maniobra(s) en Regular: el alumno repite ${esc(l.id)} en el próximo vuelo.</div>`
      : hechas < keys.length ? `<div class="resultado inc">Calificadas ${hechas} de ${keys.length}. Si quedan sin calificar, la lección no se aprueba.</div>`
      : `<div class="resultado ok">Todo en Bien o Muy bien: ${esc(l.id)} queda aprobada y el alumno avanza a la siguiente.</div>`;
  };
  if (esAlumno) {
    tabla();
    $('#c-lec', m.el).onchange = (e) => { lec = e.target.value; for (const k of Object.keys(notas)) delete notas[k]; tabla(); };
    $$('[data-todas]', m.el).forEach((b) => b.onclick = () => { Store.itemKeys(Store.LECCIONES[lec]).forEach((k) => notas[k] = b.dataset.todas); tabla(); });
  }
  $('#c-ok', m.el).onclick = async () => {

    if (res === undefined) return;
    toast(res === true ? 'Vuelo cerrado' : res.estado === 'aprobada' ? `${res.leccion} aprobada ✓` : `${res.leccion}: el alumno debe repetirla`, 'ok');
    m.cerrar(); despues();
  };
}
