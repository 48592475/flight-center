function itemNovedad(n, i, { mecanico }) {
  const [txt, cls] = ESTADO_NOV[n.estado];
  return `<div class="novedad anim ${n.tipo} ${['resuelta', 'descartada'].includes(n.estado) ? 'resuelta' : ''}" style="--i:${i}">
    <div class="novedad-head"><div class="flujo"><span class="badge ${n.tipo === 'falla' ? 'danger' : n.tipo === 'mantenimiento' ? 'warn' : ''}">${TIPO_NOV[n.tipo]}</span><span class="badge ${cls}">${txt}</span>
      ${n.recurso ? `<span class="badge gris">${esc(n.recurso)}</span>` : ''}</div>
      <span class="muted" style="font-size:12px">Reportó ${esc(n.autor)} · ${esc(fmtCorta(n.fecha.slice(0, 10)))}</span></div>
    <p>${esc(n.descripcion)}</p>
    ${n.revision?.comentario ? `<div class="res"><b>Mecánico (${esc(n.revision.mecanico)} · ${esc(fmtCorta(n.revision.fecha.slice(0, 10)))}):</b> ${esc(n.revision.comentario)}</div>` : ''}
    ${mecanico ? `<div class="acc"><button class="btn sm ${n.estado === 'reportada' ? '' : 'sec'}" data-rev="${n.id}">${n.estado === 'reportada' ? 'Revisar' : 'Modificar'}</button></div>` : ''}</div>`;
}
async function libroNovedades(cont, rec, { mecanico = false, reportar = false, admin = false, recargar }) {
  const novs = await Store.novedades(rec.id);
  cont.innerHTML = `<div class="grid-2">
    <div class="card anim"><div class="card-head"><h3>Libro de novedades · <span class="mono">${esc(rec.nombre)}</span></h3>
      <div class="flujo">${mecanico || admin ? `<button class="btn ${rec.estado === 'operativa' ? 'danger' : 'ok'} sm" id="toggle">${rec.estado === 'operativa' ? 'Poner fuera de servicio' : 'Habilitar (operativo)'}</button>` : ''}
        ${admin ? '<button class="btn sec sm" id="edit-rec">Editar equipo</button>' : ''}</div></div>
      ${novs.length ? novs.map((n, i) => itemNovedad({ ...n, recurso: null }, i, { mecanico })).join('') : vacio('Sin novedades registradas.')}</div>
    ${reportar ? `<div class="card anim" style="--i:1;align-self:start"><div class="card-head"><h3>${mecanico ? 'Nueva anotación' : 'Reportar novedad'}</h3></div>
      <form id="f-nov" style="display:grid;gap:12px">
        <label class="campo">Tipo<select id="n-tipo" name="tipo">${Object.entries(TIPO_NOV).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></label>
        <label class="campo">Descripción<textarea id="n-desc" name="descripcion" placeholder="Ej: Indicador de temperatura de aceite oscila en crucero…"></textarea></label>
        ${mecanico ? '' : '<p class="muted" style="margin:0">El mecánico revisa cada reporte y decide si corresponde, lo corrige o lo da por resuelto.</p>'}
        <button class="btn" type="submit">${mecanico ? 'Agregar al libro' : 'Enviar al mecánico'}</button></form></div>` : ''}</div>`;
  const f = $('#f-nov', cont);
  if (f) f.onsubmit = async (e) => { e.preventDefault(); if (await hacer(async () => { await Store.reportarNovedad(rec.id, f.tipo.value, f.descripcion.value); return true; }, mecanico ? 'Anotación agregada' : 'Novedad reportada al mecánico')) await recargar(); };
  const t = $('#toggle', cont);
  if (t) t.onclick = async () => { const n = await hacer(async () => await Store.estadoRecurso(rec.id, rec.estado === 'operativa' ? 'mantenimiento' : 'operativa'));
    if (n !== undefined) { toast(n ? `${rec.nombre} fuera de servicio. Tiene ${n} reserva(s) pendiente(s) para reprogramar.` : 'Estado actualizado', 'ok'); await recargar(); } };
  const ed = $('#edit-rec', cont); if (ed) ed.onclick = () => editarRecurso(rec, recargar);
  $$('[data-rev]', cont).forEach((b) => b.onclick = () => revisarNovedad(novs.find((n) => n.id == b.dataset.rev), recargar));
}
function revisarNovedad(n, despues) {
  const m = modal(`<div class="modal-head"><div><h3>Revisión del mecánico</h3><div class="muted">${esc(n.recurso)} · reportó ${esc(n.autor)}</div></div><button class="x" data-cerrar aria-label="Cerrar">×</button></div>
    <form class="modal-body" id="f-rev" style="display:grid;gap:12px">
      <label class="campo">Decisión<select id="r-estado" name="estado">
        <option value="en_revision" ${n.estado === 'en_revision' ? 'selected' : ''}>Correcto, queda en revisión / trabajo pendiente</option>
        <option value="resuelta" ${n.estado === 'resuelta' ? 'selected' : ''}>Resuelta</option>
        <option value="descartada" ${n.estado === 'descartada' ? 'selected' : ''}>No es falla (descartada)</option>
        <option value="reportada" ${n.estado === 'reportada' ? 'selected' : ''}>Sin revisar</option></select></label>
      <label class="campo">Tipo<select id="r-tipo" name="tipo">${Object.entries(TIPO_NOV).map(([k, t]) => `<option value="${k}" ${n.tipo === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label class="campo">Descripción <span class="op">(podés corregir lo que se anotó)</span><textarea id="r-desc" name="descripcion">${esc(n.descripcion)}</textarea></label>
      <label class="campo">Comentario del mecánico<textarea id="r-com" name="comentario" placeholder="Qué se hizo, qué falta o por qué no corresponde">${esc(n.revision?.comentario || '')}</textarea></label>
    </form><div class="modal-foot"><button class="btn sec" data-cerrar>Volver</button><button class="btn" id="r-ok">Guardar revisión</button></div>`);
  $('#r-ok', m.el).onclick = async () => { if (await hacer(async () => { await Store.revisarNovedad(n.id, Object.fromEntries(new FormData($('#f-rev', m.el)))); return true; }, 'Revisión guardada')) { m.cerrar(); despues(); } };
}
function editarRecurso(r, despues) {
  const m = modal(`<div class="modal-head"><h3>${r ? 'Editar equipo' : 'Agregar equipo'}</h3><button class="x" data-cerrar aria-label="Cerrar">×</button></div>
    <form class="modal-body form-grid" id="f-rec">
      <label class="campo">Tipo<select id="e-tipo" name="tipo"><option value="avion" ${r?.tipo === 'avion' ? 'selected' : ''}>Aeronave</option><option value="simulador" ${r?.tipo === 'simulador' ? 'selected' : ''}>Simulador</option></select></label>
      <label class="campo">Matrícula o nombre<input id="e-nombre" name="nombre" value="${esc(r?.nombre || '')}" placeholder="LV-FCE"></label>
      <label class="campo full">Modelo<input id="e-modelo" name="modelo" value="${esc(r?.modelo || '')}" placeholder="Cessna 152"></label>
    </form><div class="modal-foot"><button class="btn sec" data-cerrar>Volver</button><button class="btn" id="e-ok">Guardar</button></div>`);
  $('#e-ok', m.el).onclick = async () => { if (await hacer(async () => await Store.guardarRecurso({ ...Object.fromEntries(new FormData($('#f-rec', m.el))), id: r?.id }), 'Equipo guardado')) { m.cerrar(); despues(); } };
}
VISTAS.flota = async function vistaFlota(v, sel) {
  const esAdmin = state.user.rol === 'admin';
  const recs = await Store.recursos(); sel = sel || state.flotaSel || recs[0]?.id; state.flotaSel = sel;
  v.innerHTML = hero('Flota', esAdmin ? 'Aeronaves y simuladores de la escuela. Podés agregar equipos y ver el libro de novedades de cada uno.' : 'Reportá fallas u observaciones. El mecánico revisa cada reporte y decide.',
    esAdmin ? '<div style="margin-top:14px"><button class="btn sec" id="nuevo-rec">+ Agregar equipo</button></div>' : '') + tarjetasFlota(recs, sel) + '<div id="libro" style="margin-top:22px"></div>';
  $$('.avion', v).forEach((b) => b.onclick = async () => await VISTAS.flota(v, Number(b.dataset.av)));
  const nr = $('#nuevo-rec', v); if (nr) nr.onclick = () => editarRecurso(null, async () => await VISTAS.flota(v));
  const rec = recs.find((r) => r.id === sel);
  if (rec) await libroNovedades($('#libro', v), rec, { reportar: true, admin: esAdmin, recargar: async () => await VISTAS.flota(v, sel) });
};
VISTAS.mantenimiento = async function vistaMantenimiento(v, sel) {
  const recs = await Store.recursos(); const todas = await Store.novedades();
  const pend = todas.filter((n) => n.estado === 'reportada'); const enRev = todas.filter((n) => n.estado === 'en_revision');
  sel = sel || state.flotaSel || recs[0]?.id; state.flotaSel = sel;
  v.innerHTML = hero(`Hola, ${esc(state.user.nombre)}`, 'Revisá los reportes de los instructores: confirmá si es falla, corregí la anotación, cerrala cuando esté resuelta y habilitá o sacá de servicio cada equipo.') + `
    <div class="stats">${stat('Reportes sin revisar', pend.length, { dest: true, i: 1 })}${stat('En revisión', enRev.length, { i: 2 })}
      ${stat('Fuera de servicio', recs.filter((r) => r.estado !== 'operativa').length, { i: 3 })}${stat('Equipos operativos', recs.filter((r) => r.estado === 'operativa').length, { i: 4 })}</div>
    <div class="card anim" style="--i:5"><div class="card-head"><h3>Pendientes de revisión</h3><span class="badge ${pend.length ? 'danger' : 'ok'}">${pend.length}</span></div>
      ${pend.length ? pend.map((n, i) => itemNovedad(n, i, { mecanico: true })).join('') : vacio('No hay reportes nuevos. ¡Todo revisado!')}</div>
    <h3 class="anim" style="margin:26px 0 14px">Flota</h3>${tarjetasFlota(recs, sel)}<div id="libro" style="margin-top:22px"></div>`;
  animarNumeros(v);
  const recargar = async () => await VISTAS.mantenimiento(v, sel);
  $$('.card [data-rev]', v).forEach((b) => b.onclick = () => revisarNovedad(todas.find((n) => n.id == b.dataset.rev), recargar));
  $$('.avion', v).forEach((b) => b.onclick = async () => await VISTAS.mantenimiento(v, Number(b.dataset.av)));
  const rec = recs.find((r) => r.id === sel);
  if (rec) await libroNovedades($('#libro', v), rec, { mecanico: true, reportar: true, recargar });
};

        ${editable ? `<div class="dia-acc"><button data-todo="${i.id}|${x.fecha}|1">todo</button><button data-todo="${i.id}|${x.fecha}|0">libre</button></div>` : ''}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div>
  <div class="leyenda"><span><span class="chip on" style="display:inline-block;padding:2px 6px">08</span> vuela en ese bloque</span><span><span class="chip ocupado" style="display:inline-block;padding:2px 6px">08</span> ya tiene vuelo o clase</span><span><span class="chip" style="display:inline-block;padding:2px 6px">08</span> no vuela</span></div>`;

}

};

function decodificarMetar(raw) {
  const t = String(raw || '').trim().toUpperCase().replace(/=$/, '').split(/\s+/);
  const r = { raw, fenomenos: [], nubes: [], cavok: false };
  let i = 0;
  if (['METAR', 'SPECI'].includes(t[i])) r.tipo = t[i++];
  r.estacion = t[i++];
  const mh = /^(\d{2})(\d{2})(\d{2})Z$/.exec(t[i] || ''); if (mh) { r.dia = +mh[1]; r.hora = `${mh[2]}:${mh[3]}`; r.horaLocal = `${String((+mh[2] + 21) % 24).padStart(2, '0')}:${mh[3]}`; i++; }
  if (t[i] === 'AUTO' || t[i] === 'COR') r.auto = t[i++] === 'AUTO';
  for (; i < t.length; i++) {
    const x = t[i];
    if (x === 'RMK' || x === 'NOSIG' || x === 'BECMG' || x === 'TEMPO') { r.tendencia = t.slice(i).join(' '); break; }
    let m;
    if ((m = /^(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?(KT|MPS)$/.exec(x))) { r.viento = { dir: m[1] === 'VRB' ? null : +m[1], vel: +m[2], raf: m[3] ? +m[3] : null, mps: m[4] === 'MPS' }; continue; }
    if ((m = /^(\d{3})V(\d{3})$/.exec(x))) { if (r.viento) r.viento.variable = [+m[1], +m[2]]; continue; }
    if (x === 'CAVOK') { r.cavok = true; r.vis = 10000; continue; }
    if (/^\d{4}$/.test(x) && r.vis == null) { r.vis = +x; continue; }
    if ((m = /^(FEW|SCT|BKN|OVC|VV)(\d{3}|\/\/\/)(CB|TCU)?$/.exec(x))) { r.nubes.push({ tipo: m[1], alt: m[2] === '///' ? null : +m[2] * 100, conv: m[3] || '' }); continue; }
    if (/^(NSC|NCD|SKC|CLR)$/.test(x)) { r.sinNubes = true; continue; }
    if ((m = /^(M?\d{2})\/(M?\d{2})?$/.exec(x))) { r.temp = +m[1].replace('M', '-'); r.rocio = m[2] ? +m[2].replace('M', '-') : null; continue; }
    if ((m = /^Q(\d{4})$/.exec(x))) { r.qnh = +m[1]; continue; }
    if ((m = /^A(\d{4})$/.exec(x))) { r.qnh = Math.round(+m[1] / 100 * 33.8639); continue; }
    if ((m = /^([+-]|VC)?((?:MI|BC|PR|DR|BL|SH|TS|FZ)?)((?:RA|DZ|SN|BR|FG|HZ|FU|GR|GS|DU|SA|SQ|FC|PL|UP|VA|PO)+)?$/.exec(x)) && (m[2] || m[3])) {

    }

  r.techo = techo;
  const vis = r.vis ?? 10000;
  r.categoria = (techo != null && techo < 500) || vis < 1600 ? 'LIFR' : (techo != null && techo < 1000) || vis < 5000 ? 'IFR' : (techo != null && techo <= 3000) || vis <= 8000 ? 'MVFR' : 'VFR';
  if (r.viento && r.viento.dir != null) {
    r.pistas = PISTAS_MOR.map((p) => { const a = ((r.viento.dir - p.rumbo) * Math.PI) / 180;
      return { ...p, frente: Math.round(r.viento.vel * Math.cos(a)), cruzado: Math.round(Math.abs(r.viento.vel * Math.sin(a))), lado: Math.sin(a) >= 0 ? 'derecha' : 'izquierda' }; });
  }

}
const CAT_TXT = { VFR: ['VFR', 'ok'], MVFR: ['VFR marginal', 'warn'], IFR: ['IFR', 'danger'], LIFR: ['IFR bajo', 'danger'] };

// consulta al servidor (Aviation Weather Center y FAA) y muestra los datos decodificados
async function mostrarMeteo(id, cont, { compacto = false } = {}) {
  cont.innerHTML = '<div class="muted" style="margin-top:14px">Consultando la fuente oficial…</div>';
  let d;
  try {
    const r = await fetch(`/api/meteo?id=${encodeURIComponent(id)}`, { credentials: 'same-origin' });
    d = await r.json(); if (!r.ok) throw new Error(d.error || 'Error');
  } catch (e) { cont.innerHTML = `<div class="aviso warn" style="margin-top:14px"><div><strong>No se pudo consultar ${esc(id)}</strong>${esc(e.message)}. Probá con los links a las fuentes oficiales.</div></div>`; return; }
  const hora = new Date(d.consultado).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
  if (d.error && !d.metar) { cont.innerHTML = `<div class="aviso warn" style="margin-top:14px"><div><strong>No se pudo consultar la fuente oficial</strong>El Aviation Weather Center no respondió. Probá de nuevo en unos minutos o abrí los links.</div></div>`; return; }
  const metar = d.metar ? tarjetaMetar({ metar: d.metar, taf: d.taf || '' }, { compacto, pegado: true })
    : `<div class="aviso" style="margin-top:14px"><div><strong>${esc(id)} no tiene METAR publicado</strong>${d.error ? esc(d.error) : 'Puede que el aeródromo no emita METAR. Probá con uno cercano.'}</div></div>`;
  const taf = !compacto ? (d.taf ? `<h4 style="margin:18px 0 6px">TAF</h4><div class="metar-raw taf">${esc(d.taf).replace(/ (FM\d{6}|BECMG|TEMPO|PROB\d{2}(?: TEMPO)?)/g, '<br>$1')}</div>` : `<p class="muted">${esc(id)} no tiene TAF vigente.</p>`) : '';
  const notam = compacto ? '' : !d.notamsConfigurado
    ? `<h4 style="margin:18px 0 6px">NOTAM</h4><p class="muted">La consulta automática de NOTAM se activa al cargar la clave de la FAA en el servidor. Mientras tanto usá los links a ANAC y FAA.</p>`
    : `<h4 style="margin:18px 0 6px">NOTAM vigentes (${(d.notams || []).length})</h4>${(d.notams || []).length ? d.notams.map((n) => `<div class="notam"><b class="mono">${esc(n.numero)}</b>${n.desde ? ` <span class="muted">${esc(n.desde.slice(0, 16).replace('T', ' '))} → ${esc((n.hasta || 'PERM').slice(0, 16).replace('T', ' '))}</span>` : ''}<pre>${esc(n.texto)}</pre></div>`).join('') : '<p class="muted">Sin NOTAM informados para este aeródromo.</p>'}`;
  cont.innerHTML = `<div style="margin-top:16px">${metar}${taf}${notam}<div class="muted" style="font-size:12px;margin-top:8px">Fuente: Aviation Weather Center (NOAA)${d.notamsConfigurado ? ' y FAA' : ''} · consultado ${hora} hs</div></div>`;
}

  const sug = (mon) => { const s = mon === 'USD' ? c.saldo_usd : c.saldo; return s > 0 ? (mon === 'USD' ? String(s).replace('.', ',') : s) : ''; };
  const m = modal(`<div class="modal-head"><div><h3>Registrar pago</h3><div class="muted">${esc(c.usuario.nombre)} ${esc(c.usuario.apellido)} · saldo ${c.saldo >= 0 ? 'a pagar' : 'a favor'} ${pesos(Math.abs(c.saldo))}</div></div><button class="x" data-cerrar aria-label="Cerrar">×</button></div>
    <form class="modal-body form-grid" id="f-pago">
      ${selMoneda('p-moneda', c.moneda)}
      <label class="campo">Monto<input id="p-monto" name="monto" inputmode="decimal" value="${sug(c.moneda)}"></label>
      <label class="campo">Fecha<input id="p-fecha" type="date" name="fecha" value="${isoLocal(new Date())}"></label>
      <label class="campo">Medio de pago<select id="p-medio" name="medio">${['efectivo', 'transferencia', 'tarjeta de débito', 'tarjeta de crédito', 'Mercado Pago'].map((x) => `<option>${x}</option>`).join('')}</select></label>
      <label class="campo">Nota <span class="op">(opcional)</span><input id="p-nota" name="nota" placeholder="N° de comprobante"></label>
    </form><div class="modal-foot"><button class="btn sec" data-cerrar>Volver</button><button class="btn ok" id="p-ok">Registrar pago</button></div>`);
  $('#p-moneda', m.el).onchange = (e) => { $('#p-monto', m.el).value = sug(e.target.value); };
  $('#p-ok', m.el).onclick = async () => { if (await hacer(async () => { await Store.registrarPago(uid, Object.fromEntries(new FormData($('#f-pago', m.el)))); return true; }, 'Pago registrado')) { m.cerrar(); despues(); } };
}
async function venderPack(uid, despues) {
  const [c, t] = await Promise.all([Store.cuenta(uid), Store.tarifas()]);
  const m = modal(`<div class="modal-head"><div><h3>Vender pack de horas</h3><div class="muted">${esc(c.usuario.nombre)} ${esc(c.usuario.apellido)} · le quedan ${fh(c.horas.vuelo)} de vuelo y ${fh(c.horas.simulador)} de simulador</div></div><button class="x" data-cerrar aria-label="Cerrar">×</button></div>
    <form class="modal-body form-grid" id="f-pack">
      <label class="campo">Tipo<select id="k-tipo" name="tipo"><option value="vuelo">Horas de vuelo</option><option value="simulador">Horas de simulador</option></select></label>
      <label class="campo">Horas<input id="k-horas" name="horas" inputmode="decimal" value="10"></label>
      <div class="full flujo" id="k-presets">${[5, 10, 20, 30].map((h) => `<button type="button" class="btn sec sm" data-h="${h}">${h} h</button>`).join('')}</div>
      <label class="campo">Descuento (%)<input id="k-desc" type="number" min="0" max="100" value="0"></label>
      ${selMoneda('k-moneda', c.moneda)}
      <label class="campo">Precio final<input id="k-precio" name="precio" inputmode="decimal"></label>
      <p class="muted full" id="k-lista" style="margin:0"></p>
      <label class="marca full"><input type="checkbox" id="k-pagado" checked> Ya lo pagó</label>
      <label class="campo" id="k-medio-c">Medio de pago<select id="k-medio" name="medio">${['efectivo', 'transferencia', 'tarjeta de débito', 'tarjeta de crédito', 'Mercado Pago'].map((x) => `<option>${x}</option>`).join('')}</select></label>
      <label class="campo">Fecha<input id="k-fecha" type="date" name="fecha" value="${isoLocal(new Date())}"></label>
    </form><div class="modal-foot"><button class="btn sec" data-cerrar>Volver</button><button class="btn ok" id="k-ok">Cargar pack</button></div>`);
  const calc = () => {
    const tipo = $('#k-tipo', m.el).value; const h = Number(String($('#k-horas', m.el).value).replace(',', '.')) || 0;
    const lista = Math.round(h * t[tipo]); const d = Number($('#k-desc', m.el).value) || 0; const enUsd = $('#k-moneda', m.el).value === 'USD' && t.tc;
    const final = lista * (1 - d / 100);
    $('#k-precio', m.el).value = enUsd ? String(Math.round(final / t.tc * 100) / 100).replace('.', ',') : Math.round(final);
    $('#k-lista', m.el).textContent = `Precio de lista: ${fh(h)} × ${pesos(t[tipo])} = ${pesos(lista)}${t.tc ? ` (${usd(lista / t.tc)})` : ''}.`;
  };
  ['#k-tipo', '#k-horas', '#k-desc'].forEach((s) => $(s, m.el).addEventListener('input', calc)); $('#k-tipo', m.el).addEventListener('change', calc); $('#k-moneda', m.el).addEventListener('change', calc);
  $$('[data-h]', m.el).forEach((b) => b.onclick = () => { $('#k-horas', m.el).value = b.dataset.h; calc(); });
  $('#k-pagado', m.el).onchange = (e) => { $('#k-medio-c', m.el).hidden = !e.target.checked; };
  calc();
  $('#k-ok', m.el).onclick = async () => {
    const d = Object.fromEntries(new FormData($('#f-pack', m.el))); d.pagado = $('#k-pagado', m.el).checked;
    if (await hacer(async () => { await Store.venderPack(uid, d); return true; }, 'Pack cargado')) { m.cerrar(); despues(); }
  };
}

const nombreLeccion = (id) => SECCIONES[id] || `${id} · ${Store.LECCIONES[id]?.titulo || ''}`;
const fmtTam = (b) => b > 1048576 ? `${(b / 1048576).toFixed(1).replace('.', ',')} MB` : `${Math.max(1, Math.round(b / 1024))} KB`;
const youtubeId = (u) => (String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/) || [])[1] || null;
const MAX_MB = () => (MODO === 'servidor' ? 20 : 2);
const leerArchivo = (file) => new Promise((ok, mal) => {
  if (!file) return ok(null);
  if (file.size > MAX_MB() * 1048576) return mal(new Error(`"${file.name}" pesa ${(file.size / 1048576).toFixed(1).replace('.', ',')} MB. El máximo es ${MAX_MB()} MB por archivo${MODO === 'servidor' ? '. Podés comprimir el PDF (por ejemplo en ilovepdf.com) o dividirlo en partes' : ' en la demo'}.`));
  const fr = new FileReader(); fr.onload = () => ok({ nombre: file.name, tam: file.size, tipo: file.type, data: fr.result }); fr.onerror = mal; fr.readAsDataURL(file);
});
async function abrirArchivo(id) {
  if (MODO === 'servidor') { window.open(`/api/archivo/${id}`, '_blank', 'noopener'); return; }
  const a = await hacer(() => Store.archivo(id)); if (!a) return;
  const bin = atob(a.data.split(',')[1]); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: a.tipo })); const w = window.open(url, '_blank');
  if (!w) { const l = document.createElement('a'); l.href = url; l.download = a.nombre; l.click(); }
}

// ---------- alumno / piloto: registrar la llegada ----------
function ubicacion() {
  return new Promise((ok, mal) => {
    if (!navigator.geolocation) return mal(new Error('Este celular no permite usar la ubicación.'));
    navigator.geolocation.getCurrentPosition((p) => ok({ lat: p.coords.latitude, lon: p.coords.longitude, precision: p.coords.accuracy }),
      () => mal(new Error('No pudimos obtener tu ubicación. Permití el acceso a la ubicación para esta página y volvé a escanear el QR.')),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  });
}
async function procesarLlegada(codigo) {
  if (!['alumno', 'ppa', 'instructor'].includes(state.user?.rol)) return toast('El QR de asistencia es para alumnos, pilotos e instructores.', 'error');

  if (MODO === 'servidor') {
    toast('Verificando tu ubicación…');
    try { pos = await ubicacion(); } catch (e) { return toast(e.message, 'error'); }
  }
  const r = await hacer(() => Store.registrarLlegada(codigo, pos)); if (!r) return;
  if (r.instructor) return llegadaInstructorUI(r);
  const yaEstaba = r.items.every((x) => x.ya);
  const e = document.createElement('div'); e.className = 'llegada-escena';
  e.innerHTML = `<div class="llegada-card">
    <div class="llegada-check">${ICON_CHECK}</div>
    <h2>${yaEstaba ? 'Tu llegada ya estaba registrada' : `¡Bienvenido/a, ${esc(r.nombre)}!`}</h2>
    <div class="hora">${esc(r.items[0].llegada)}</div>
    <p class="muted" style="margin:0 0 6px">${yaEstaba ? 'No hace falta volver a escanear.' : 'Quedaste presente. Tu instructor ya lo puede ver.'}</p>
    ${r.items.map((x) => `<div class="llegada-item"><b>${TIPO_RES[x.tipo]}</b> · ${rango(x.bloque)} · ${esc(x.titulo || x.recurso)}${x.instructor ? `<br><span class="muted">con ${esc(x.instructor)}</span>` : ''}</div>`).join('')}
    <button class="btn block" id="ll-ok" style="margin-top:18px">Listo</button></div>`;
  document.body.append(e);
  $('#ll-ok', e).onclick = () => { e.style.animation = 'fadeIn .25s reverse both'; setTimeout(() => e.remove(), 220); if (state.tab === 'reservas') renderApp(); };
}

function llegadaInstructorUI(r) {
  const e = document.createElement('div'); e.className = 'llegada-escena';
  const titulo = r.ya ? 'Tu llegada ya estaba registrada' : r.tarde ? `Llegaste ${r.minutos_tarde} min tarde` : `¡Buen día, ${esc(r.nombre)}!`;
  e.innerHTML = `<div class="llegada-card">
    <div class="llegada-check ${r.tarde ? 'tarde' : ''}">${r.tarde ? '!' : ICON_CHECK}</div>
    <h2>${titulo}</h2>
    <div class="hora" ${r.tarde ? 'style="color:#d97706"' : ''}>${esc(r.hora)}</div>
    <p class="muted" style="margin:0 0 6px">${r.ya ? 'No hace falta volver a escanear.' : r.tarde ? `Tu primer turno era a las ${hh(r.primer_bloque)}. Quedó registrado en tu historial y se avisó a la administración.` : 'Llegada registrada a tiempo. Tus alumnos ya te ven en la escuela.'}</p>
    ${r.items.map((x) => `<div class="llegada-item"><b>${TIPO_RES[x.tipo]}</b> · ${rango(x.bloque)} · ${esc(x.titulo || x.recurso)}${x.con ? `<br><span class="muted">con ${esc(x.con)}</span>` : ''}</div>`).join('')}
    <button class="btn block" id="ll-ok" style="margin-top:18px">Listo</button></div>`;
  document.body.append(e);
  $('#ll-ok', e).onclick = () => { e.style.animation = 'fadeIn .25s reverse both'; setTimeout(() => e.remove(), 220); if (state.tab === 'agenda') renderApp(); };
}
const ESTADO_ASIS = { a_tiempo: '<span class="badge ok">A tiempo</span>', tarde: '<span class="badge danger">Tarde</span>', sin_registro: '<span class="badge gris">Sin registro</span>' };
const filaAsis = (x) => `<tr><td style="white-space:nowrap">${esc(fmtCorta(x.fecha))}</td><td class="mono">${x.primer_bloque != null ? hh(x.primer_bloque) : '—'}</td><td class="mono">${esc(x.hora || '—')}</td>
  <td>${ESTADO_ASIS[x.estado]}${x.estado === 'tarde' ? ` <span class="muted">${x.minutos_tarde} min</span>` : ''}</td><td class="muted">${x.actividades} ${x.actividades === 1 ? 'turno' : 'turnos'}</td></tr>`;
const tablaAsis = (filas) => filas.length ? `<div class="tabla-wrap"><table><thead><tr><th>Fecha</th><th>Primer turno</th><th>Llegada</th><th>Estado</th><th>Actividad</th></tr></thead><tbody>${filas.map(filaAsis).join('')}</tbody></table></div>` : vacio('Todavía no hay registros.');
// instructor: su propio historial en la agenda
{
  const agenda = VISTAS.agenda;
  VISTAS.agenda = async function (v, ...a) {
    await agenda(v, ...a);
    const h = await Store.miAsistencia();
    const card = document.createElement('div'); card.className = 'card anim';
    card.innerHTML = `<div class="card-head"><h3>Mi asistencia</h3><span class="muted">Escaneá el QR de la escuela al llegar · tolerancia ${h.tolerancia} min · últimos 60 días</span></div>
      <div class="flujo" style="margin-bottom:12px"><span class="badge ok">${h.a_tiempo} a tiempo</span><span class="badge danger">${h.tarde} tarde</span><span class="badge gris">${h.sin_registro} sin registro</span></div>
      ${tablaAsis(h.filas.slice(0, 8))}`;
    v.append(card);
  };
}
// administración: historial de cada instructor
async function historialInstructorUI(id) {
  const h = await hacer(async () => await Store.asistenciaDeInstructor(id)); if (!h) return;
  modal(`<div class="modal-head"><div style="display:flex;gap:12px;align-items:center">${avatarDe(h, 48)}<div><h3>${esc(h.nombre)} ${esc(h.apellido)}</h3><div class="muted">Asistencia del último año</div></div></div><button class="x" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="modal-body"><div class="flujo" style="margin-bottom:14px"><span class="badge ok">${h.a_tiempo} a tiempo</span><span class="badge danger">${h.tarde} tarde</span><span class="badge gris">${h.sin_registro} sin registro</span></div>${tablaAsis(h.filas)}</div>`, { ancho: true });
}
{
  const dispo = VISTAS.dispo;
  VISTAS.dispo = async function (v, ...a) {
    await dispo(v, ...a);
    const l = await Store.asistenciaInstructores(); const tol = l[0]?.tolerancia ?? 10;
    const card = document.createElement('div'); card.className = 'card anim';
    card.innerHTML = `<div class="card-head"><h3>Asistencia de instructores</h3>
        <div class="flujo"><span class="muted">Últimos 60 días · tolerancia</span><input id="tol" type="number" min="0" max="60" value="${tol}" style="width:76px" aria-label="Tolerancia en minutos"><span class="muted">min</span></div></div>
      <p class="muted" style="margin:-4px 0 14px">Los instructores escanean el mismo QR que los alumnos al llegar. Si llegan después de su primer turno más la tolerancia, queda como tarde y te llega un aviso.</p>
      ${l.length ? `<div class="tabla-wrap"><table><thead><tr><th>Instructor</th><th>A tiempo</th><th>Tarde</th><th>Sin registro</th><th>Última llegada</th><th></th></tr></thead><tbody>
        ${l.map((i) => { const ult = i.filas.find((x) => x.hora);
          return `<tr><td><div style="display:flex;gap:10px;align-items:center">${avatarDe(i, 34)}<strong>${esc(i.nombre)} ${esc(i.apellido)}</strong></div></td>
          <td><span class="badge ok">${i.a_tiempo}</span></td><td><span class="badge ${i.tarde ? 'danger' : 'gris'}">${i.tarde}</span></td><td><span class="badge gris">${i.sin_registro}</span></td>
          <td>${ult ? `${esc(fmtCorta(ult.fecha))} ${esc(ult.hora)} ${ESTADO_ASIS[ult.estado]}` : '—'}</td><td style="text-align:right"><button class="btn sec sm" data-hist="${i.id}">Ver historial</button></td></tr>`; }).join('')}
      </tbody></table></div>` : vacio('No hay instructores activos.')}`;
    v.append(card);
    $$('[data-hist]', card).forEach((b) => b.onclick = () => historialInstructorUI(Number(b.dataset.hist)));
    $('#tol', card).onchange = async (e) => { if (await hacer(async () => await Store.guardarTolerancia(e.target.value), 'Tolerancia actualizada') !== undefined) await VISTAS.dispo(v, ...a); };
  };
}

// ---------- instructor y administración: actualización automática ----------
let refresco = null;
function vigilar(v, vista, inicial, cada = 30000) {
  clearInterval(refresco);
  // punto de partida: los presentes que ya se ven en pantalla
  let antes = inicial;
  refresco = setInterval(async () => {
    if (!document.body.contains(v) || state.tab !== vista) return clearInterval(refresco);
    if (document.hidden || $('#modal-root').children.length || document.activeElement?.matches('input,select,textarea')) return;
    try {
      const r = await Store.resumenInstructor(isoLocal(new Date()).slice(0, 7));
      const presentes = r.pendientes.filter((f) => f.llegada).map((f) => `${f.id}|${f.piloto}|${f.llegada}`);
      for (const p of presentes) if (!antes.includes(p)) { const [, n, h] = p.split('|'); toast(`${n} llegó a la escuela (${h})`, 'ok'); }
      const cambio = presentes.join() !== antes.join(); antes = presentes;
      if (cambio) { const y = scrollY; await VISTAS.agenda(v); scrollTo(0, y); }
    } catch { /* sin conexión: se reintenta en la próxima vuelta */ }
  }, cada);
}
{
  const agenda = VISTAS.agenda;
  VISTAS.agenda = async function (v, ...a) {
    await agenda(v, ...a);
    let inicial = [];
    try { inicial = (await Store.resumenInstructor(isoLocal(new Date()).slice(0, 7))).pendientes.filter((f) => f.llegada).map((f) => `${f.id}|${f.piloto}|${f.llegada}`); } catch { /* se arma en la próxima vuelta */ }
    vigilar(v, 'agenda', inicial);
  };
}

// ---------- habilitaciones: las ve el alumno o piloto en su perfil ----------
{
  const perfil = VISTAS.perfil;
  VISTAS.perfil = async function (v, ...a) {
    await perfil(v, ...a);
    const u = state.user; if (!['alumno', 'ppa'].includes(u?.rol)) return;
    const h = u.hab || {}; const aviones = await Store.recursos('avion');
    const item = (ok, t) => `<span class="badge ${ok ? 'ok' : 'gris'}">${ok ? '✓' : '✗'} ${t}</span>`;
    const card = document.createElement('div'); card.className = 'card anim';
    card.innerHTML = `<div class="card-head"><h3>Mis habilitaciones</h3><span class="muted">Las otorga la administración</span></div>
      <div class="flujo">${item(h.solo, 'Vuelo solo')}${item(h.sim_solo, 'Simulador sin instructor')}${item(h.travesia, 'Travesías')}${u.rol === 'ppa' ? item(h.bristell, 'Adaptado a Bristell') : ''}</div>
      <p class="muted" style="margin:10px 0 0">Aeronaves: ${Array.isArray(h.aeronaves) ? (h.aeronaves.length ? aviones.filter((a) => h.aeronaves.includes(a.id)).map((a) => esc(a.nombre)).join(', ') : 'ninguna') : 'todas las de la escuela'}.</p>`;
    $$('.card', v)[0].after(card);
  };
}

// ---------- inicio ----------
// pantalla cuando la app instalada se abre sin internet (o con el servidor dormido)
function sinConexion(msg) {
  document.getElementById('app').innerHTML = `<div class="sin-red"><div class="sin-red-caja anim">
    ${logo('', 'claro')}
    <h2>Sin conexión</h2><p>${esc(msg || 'No hay conexión con el servidor.')}</p>
    <p class="muted">Apenas vuelva internet, la app se recarga sola.</p>
    <button class="btn" id="reintentar">Reintentar</button></div></div>`;
  document.getElementById('reintentar').onclick = () => location.reload();
  addEventListener('online', () => location.reload(), { once: true });
}
(async () => {
  const q = new URLSearchParams(location.search);
  let codigo = q.get('asistencia');
  if (codigo) { try { sessionStorage.setItem('fc-asistencia', codigo); } catch { /* sin storage */ } history.replaceState(null, '', location.pathname + location.hash); }
  else { try { codigo = sessionStorage.getItem('fc-asistencia'); } catch { codigo = null; } }
  try { state.user = await Store.yo(); } catch (e) { return sinConexion(e.message); }
  if (state.user && MODO === 'demo') await Store.recordatoriosDeuda();
  await render();
  const pendiente = () => { try { return sessionStorage.getItem('fc-asistencia'); } catch { return codigo; } };
  const limpiar = () => { try { sessionStorage.removeItem('fc-asistencia'); } catch { /* sin storage */ } };
  if (codigo && state.user) { limpiar(); await procesarLlegada(codigo); }
  else if (codigo) {
    toast('Iniciá sesión para registrar tu llegada');
    // cuando inicie sesión, se registra la llegada
    const espera = setInterval(async () => { if (state.user && pendiente()) { clearInterval(espera); const c = pendiente(); limpiar(); await procesarLlegada(c); } }, 700);
  }
})();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
